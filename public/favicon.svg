<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="CommitAtlas">
  <title>CommitAtlas</title>
  <!--
    The map-quadrant mark, built as a 16px construction rather than scaled down from a larger one.
    Three shapes and one stroke weight: at tab size anything busier collapses into a smudge, and a
    hairline disappears outright.

    The frame is drawn in ink so it holds on a dark tab, and flips to the Limestone ink on a light
    one. The ember quadrant and the gold survey cell are the temperature scale, and they read on
    both grounds, so only the frame needs the media query.
  -->
  <style>
    .frame { stroke: #eee9e1; }
    @media (prefers-color-scheme: light) { .frame { stroke: #23261c; } }
  </style>
  <rect class="frame" x="2" y="2" width="12" height="12" fill="none" stroke-width="1.6"/>
  <rect x="8.8" y="2.8" width="4.4" height="4.4" fill="#ff7a45"/>
  <rect x="4" y="9" width="2" height="2" fill="#ffd166"/>
</svg>
