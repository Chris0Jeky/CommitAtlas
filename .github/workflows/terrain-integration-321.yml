name: Terrain integration 321
on:
  push:
    branches: [grok/activity-terrain-135]
    paths: [.github/workflows/terrain-integration-321.yml]
permissions:
  contents: write
concurrency:
  group: terrain-integration-321
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/grok/activity-terrain-135'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Reconcile main and correct the test fixture options
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit cea038bd45c0c1204874ca177e184aae22f1c0b4
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const boundary='packages/svg/tests/activity-terrain-boundaries.test.mjs';
          let b=fs.readFileSync(boundary,'utf8');
          const before='{days: length, asOf: to}';
          assert.equal(b.split(before).length,2);
          b=b.replace(before,'{days: length, asOf: to, commits: length * count, issues: 0, pullRequests: 0, reviews: 0}');
          fs.writeFileSync(boundary,b);
          const positive='packages/svg/tests/activity-terrain.test.mjs';
          let p=fs.readFileSync(positive,'utf8'), changes=0;
          p=p.replace(/calculateContributionMetrics\(([^,]+), \{ days: 14, asOf: TO \}\)/g,(_,input)=>{
            changes++; return `calculateContributionMetrics(${input}, { days: 14, asOf: TO, commits: ${input}.reduce((sum, day) => sum + day.count, 0), issues: 0, pullRequests: 0, reviews: 0 })`;
          });
          assert.equal(changes,2);
          fs.writeFileSync(positive,p);
          JS
          git add -- packages/svg/tests/activity-terrain.test.mjs packages/svg/tests/activity-terrain-boundaries.test.mjs
          git commit -m 'test(svg): construct terrain metrics with complete breakdown options'
          mkdir -p terrain-preview
          git rev-parse HEAD > terrain-preview/checkout.txt
      - run: npm ci --no-audit --no-fund
      - name: Validate types, lint and every SVG suite
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee terrain-preview/typecheck.log
          npm run lint 2>&1 | tee terrain-preview/lint.log
          npm run test:svg 2>&1 | tee terrain-preview/tests.log
      - run: npm run build:action
      - run: node --test action/action.test.mjs action/evidence-output.test.mjs
      - name: Retain generated terrain examples for review
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {calculateContributionMetrics} from './packages/core/dist/index.js';
          import {getScene,renderSceneDefinition,themes} from './packages/svg/dist/index.js';
          const dir='terrain-preview',from=Date.parse('2026-01-04T00:00:00Z');
          for(const variant of ['active','zero','stale','maximum']) for(const layout of ['wide','compact']) for(const theme of Object.keys(themes)) {
            const days=Array.from({length:variant==='maximum'?731:14},(_,i)=>({date:new Date(from+i*86400000).toISOString().slice(0,10),count:variant==='zero'?0:variant==='maximum'?100000:i%5===0?3:0}));
            const to=days.at(-1).date;
            const freshness={generatedAt:`${to}T23:59:59.999Z`,source:'synthetic-demo',mode:'demo'};
            const metrics=calculateContributionMetrics(days,{days:days.length,asOf:to,commits:days.reduce((sum,day)=>sum+day.count,0),issues:0,pullRequests:0,reviews:0});
            const snapshot={version:1,freshness,contributions:{days,freshness:variant==='stale'?{...freshness,mode:'stale'}:freshness},metrics,projects:{freshness,projects:Array.from({length:variant==='maximum'?6:1},(_,i)=>({releaseState:'published',release:{tag:variant==='maximum'?'界'.repeat(40):`v${i+1}.0`,publishedAt:`${to}T12:00:00Z`}}))}};
            const result=renderSceneDefinition(getScene('activity-terrain'),{snapshot},{theme,layout,pack:'survey',motion:'none',backend:'smil',instanceNamespace:'preview',seed:''});
            fs.writeFileSync(`${dir}/${variant}-${layout}-${theme}.svg`,result.svg);
          }
          JS
      - name: Retain exact source, built modules and test evidence
        if: always()
        run: |
          mkdir -p terrain-preview
          tar -czf terrain-preview/packages.tgz packages scripts package.json tsconfig.json node_modules/zod
      - name: Upload review examples and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terrain-preview-321
          path: terrain-preview/
          retention-days: 14
      - name: Publish the reconciled source and generated bundle
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only -- . ':!action/dist')"
          git diff --check
          git add -- action/dist
          if ! git diff --cached --quiet; then git commit -m 'build(action): include validated activity terrain'; fi
          remote_head=$(git ls-remote origin refs/heads/grok/activity-terrain-135 | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/grok/activity-terrain-135
