name: Terrain integration 321
on:
  push:
    branches: [grok/activity-terrain-135]
    paths: [.github/workflows/terrain-integration-321.yml]
permissions:
  contents: write
concurrency:
  group: terrain-integration-321
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/grok/activity-terrain-135'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Apply the locally tested stationary streak ridge
        run: |
          set -euo pipefail
          test "$(git hash-object packages/svg/src/scenes/activity-terrain.ts)" = 14fc4ecf191b6c31740074d7274764e2f05bbd3b
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const path='packages/svg/src/scenes/activity-terrain.ts';
          let source=fs.readFileSync(path,'utf8');
          const before="  output += text(24, 493, 'SUNDAY COLUMNS / BOUNDARY WEEKS MAY BE PARTIAL', theme.muted, 10);";
          assert.equal(source.split(before).length,2);
          const addition=[
            "  output += text(24, 477, 'RIDGE = STREAK / WINDOW DAYS', theme.muted, 10);",
            "  const windowDays = (utcDay(model.to)! - utcDay(model.from)!) / DAY + 1;",
            "  const ridgeStart = width / 2, ridgeSpan = width / 2 - 24;",
            '  output += `<line x1="${ridgeStart}" y1="474" x2="${width - 24}" y2="474" stroke="${theme.muted}"/>`;',
            '  output += `<line id="${sceneElementId(context, \'streak-ridge\')}" x1="${ridgeStart}" y1="474" x2="${ridgeStart + ridgeSpan * model.streak / windowDays}" y2="474" stroke="${model.streak === 0 ? theme.muted : theme.chrome}" stroke-width="2"><title>Current streak divided by declared window days</title></line>`;'
          ].join('\n')+'\n';
          source=source.replace(before,addition+before);
          source=source.replace('Weekly elevation follows Sunday-column sums. Boundary weeks may be partial.','Weekly elevation follows Sunday-column sums. Boundary weeks may be partial. The stationary streak ridge spans current streak divided by declared window days; printed days remain exact.');
          fs.writeFileSync(path,source);
          JS
          cat >> packages/svg/tests/activity-terrain-boundaries.test.mjs <<'JS'

          test('the stationary streak ridge uses the declared window without an arbitrary cap', () => {
            for (const layout of ['wide', 'compact']) for (const activeDays of [0, 7, 14]) {
              const value = inputs();
              value.snapshot.contributions.days.forEach((day, index) => { day.count = index >= 14 - activeDays ? 1 : 0; });
              value.snapshot.metrics = calculateContributionMetrics(value.snapshot.contributions.days, {
                days: 14, asOf: '2026-01-17', commits: activeDays, issues: 0, pullRequests: 0, reviews: 0,
              });
              const result = render(value, {layout, motion: 'ambient'});
              const doc = parseSceneXml(result.svg);
              const visit = node => [node, ...node.children.flatMap(visit)];
              const ridge = visit(doc.root).find(node => node.attrs.id?.endsWith('-element-streak-ridge'));
              assert.ok(ridge, 'current streak has a ridge line');
              const width = layout === 'compact' ? 480 : 720;
              assert.equal(Number(ridge.attrs.x1), width / 2);
              assert.equal(Number(ridge.attrs.x2), width / 2 + (width / 2 - 24) * activeDays / 14);
              assert.equal(ridge.attrs.stroke, activeDays === 0 ? svg.themes.aurora.muted : svg.themes.aurora.chrome);
              assert.equal(ridge.children.filter(node => node.name.startsWith('animate')).length, 0);
              assert.match(painted(result), /RIDGE = STREAK \/ WINDOW DAYS/);
            }
          });
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/svg/src/scenes/activity-terrain.ts packages/svg/tests/activity-terrain-boundaries.test.mjs
          git commit -m 'feat(svg): draw the exact window-scaled stationary streak ridge'
          mkdir -p terrain-preview
      - run: npm ci --no-audit --no-fund
      - run: npm run build:action
      - name: Record generated Action before the clean rebuild gate
        run: |
          git add -- action/dist
          if ! git diff --cached --quiet; then git commit -m 'build(action): regenerate the final activity terrain scene'; fi
          git rev-parse HEAD > terrain-preview/tested-head.txt
      - name: Run the complete repository gate
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee terrain-preview/full-check.log
      - name: Retain exact synthetic previews and source identities
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {calculateContributionMetrics} from './packages/core/dist/index.js';
          import {getScene,renderSceneDefinition,themes} from './packages/svg/dist/index.js';
          const dir='terrain-preview',from=Date.parse('2026-01-04T00:00:00Z'),receipts=[];
          for(const variant of ['active','zero','stale','maximum']) for(const layout of ['wide','compact']) for(const theme of Object.keys(themes)) {
            const days=Array.from({length:variant==='maximum'?731:14},(_,i)=>({date:new Date(from+i*86400000).toISOString().slice(0,10),count:variant==='zero'?0:variant==='maximum'?100000:i%5===0?3:0}));
            const to=days.at(-1).date;
            const freshness={generatedAt:`${to}T23:59:59.999Z`,source:'synthetic-demo',mode:'demo'};
            const metrics=calculateContributionMetrics(days,{days:days.length,asOf:to,commits:days.reduce((sum,day)=>sum+day.count,0),issues:0,pullRequests:0,reviews:0});
            const snapshot={version:1,freshness,contributions:{days,freshness:variant==='stale'?{...freshness,mode:'stale'}:freshness},metrics,projects:{freshness,projects:Array.from({length:variant==='maximum'?6:1},(_,i)=>({releaseState:'published',release:{tag:variant==='maximum'?'界'.repeat(40):`v${i+1}.0`,publishedAt:`${to}T12:00:00Z`}}))}};
            const result=renderSceneDefinition(getScene('activity-terrain'),{snapshot},{theme,layout,pack:'survey',motion:'none',backend:'smil',instanceNamespace:'preview',seed:''});
            const name=`${variant}-${layout}-${theme}.svg`;
            fs.writeFileSync(`${dir}/${name}`,result.svg);
            receipts.push({name,sha256:crypto.createHash('sha256').update(result.svg).digest('hex'),counters:result.counters,unavailable:result.unavailable});
          }
          fs.writeFileSync(`${dir}/preview-receipts.json`,JSON.stringify(receipts,null,2)+'\n');
          JS
      - name: Retain built modules and test evidence
        if: always()
        run: |
          mkdir -p terrain-preview
          tar -czf terrain-preview/packages.tgz packages scripts package.json tsconfig.json node_modules/zod
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terrain-final-321
          path: terrain-preview/
          retention-days: 14
      - name: Publish only after the complete gate succeeds
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
          remote_head=$(git ls-remote origin refs/heads/grok/activity-terrain-135 | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/grok/activity-terrain-135
