name: Terrain integration 321
on:
  push:
    branches: [grok/activity-terrain-135]
    paths: [.github/workflows/terrain-integration-321.yml]
permissions:
  contents: write
concurrency:
  group: terrain-integration-321
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/grok/activity-terrain-135'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Apply locally verified layout regressions on reviewed main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit fcae01cdbbe0765e1750dcf9bc89277be4c99a1a
          test "$(git hash-object packages/svg/src/scenes/activity-terrain.ts)" = f98c269af1f647d7dce3878331a6685d056d46b8
          git apply <<'PATCH'
          diff --git a/packages/svg/src/scenes/activity-terrain.ts b/packages/svg/src/scenes/activity-terrain.ts
          --- a/packages/svg/src/scenes/activity-terrain.ts
          +++ b/packages/svg/src/scenes/activity-terrain.ts
          @@ -185,7 +185,7 @@
               slots.set(peak.index, slot + 1);
               const y = plotY + plotHeight - 42 - slot * 18;
               output += `<path d="M${x} ${y - 5}l5 5 -5 5 -5 -5Z" fill="${theme.background}" stroke="${theme.chrome}"><title>${escapeXml(peak.label)}</title></path>`;
          -    output += text(Math.min(x + 8, width - 40), y + 4, String(index + 1), theme.text, 10);
          +    output += text(x > width - 56 ? x - 18 : x + 8, y + 4, String(index + 1), theme.text, 10);
             });
             const readings = [
               ['TOTAL', `${model.total} CONTRIBUTIONS`], ['PEAK WEEK', `${model.peak} CONTRIBUTIONS`],
          @@ -212,11 +212,38 @@
             return output;
           }
           
          +/** Preserve the engine-owned unavailable reason without overflowing a compact embed. */
          +function renderUnavailable(state: SceneUnavailable, context: RenderContext, labels: Readonly<{ title: string; description: string }>): string {
          +  const theme = themes[context.theme];
          +  const width = context.layout === 'compact' ? 480 : 720;
          +  const limit = context.layout === 'compact' ? 44 : 72;
          +  const lines: string[] = [];
          +  let line = '';
          +  for (const word of state.reason.split(/\s+/u)) {
          +    const chunks = [...word];
          +    while (chunks.length > limit) {
          +      if (line) { lines.push(line); line = ''; }
          +      lines.push(chunks.splice(0, limit).join(''));
          +    }
          +    const rest = chunks.join('');
          +    if (line && line.length + rest.length + 1 > limit) { lines.push(line); line = ''; }
          +    if (rest) line += `${line ? ' ' : ''}${rest}`;
          +  }
          +  if (line) lines.push(line);
          +  const height = Math.max(240, 190 + lines.length * 22);
          +  return `<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${escapeXml(labels.title)}" viewBox="0 0 ${width} ${height}"><title>${escapeXml(labels.title)}</title><desc>${escapeXml(labels.description)}</desc>` +
          +    frame(context, { title: 'Activity terrain', ref: 'TERRAIN / 01', family: 'map', width, height }) +
          +    text(24, 112, 'UNAVAILABLE', theme.text, 18) +
          +    lines.map((value, index) => text(24, 144 + index * 22, value, theme.muted, 12)).join('') +
          +    text(24, height - 24, 'NO CURRENT ACTIVITY READING', theme.muted, 11) + '</svg>';
          +}
          +
           /** Complete public calendar, separate latest-release evidence, and explicit observation provenance. */
           export const activityTerrainScene: SceneDefinition<TerrainModel> = {
             id: 'activity-terrain', family: 'map', budget: 'map',
             supportedPacks: ['survey'], supportedMotion: ['none', 'subtle', 'ambient'],
             buildModel: ({ snapshot }: SceneInputs) => buildTerrain(snapshot),
             accessibility,
          +  renderUnavailable,
             render: (model, context) => renderTerrain(model, context, accessibility(model)),
           };
          PATCH
          cat >> packages/svg/tests/activity-terrain-boundaries.test.mjs <<'JS'

          test('unavailable terrain fits the requested layout and preserves the full reason visibly', () => {
            for (const theme of Object.keys(svg.themes)) for (const layout of ['wide', 'compact']) {
              const value = inputs();
              value.snapshot.contributions.freshness.mode = 'stale';
              const result = render(value, {theme, layout, motion: 'ambient'});
              const doc = parseSceneXml(result.svg);
              const width = layout === 'compact' ? 480 : 720;
              assert.equal(Number(doc.root.attrs.viewBox.split(' ')[2]), width);
              assert.ok(painted(result).includes(scene().buildModel(value).reason));
              const visit = node => {
                if (node.name === 'text') {
                  const words = sceneVisibleText(node), x = Number(node.attrs.x), size = Number(node.attrs['font-size'] ?? 16);
                  const extent = words.length * size * 0.7, anchor = node.attrs['text-anchor'];
                  const right = anchor === 'end' ? x : anchor === 'middle' ? x + extent / 2 : x + extent;
                  const left = anchor === 'end' ? x - extent : anchor === 'middle' ? x - extent / 2 : x;
                  assert.ok(left >= 18 && right <= width - 18, `Unbounded unavailable line: ${words}`);
                }
                for (const child of node.children) visit(child);
              };
              visit(doc.root);
              assert.equal(result.counters.animatedElements, 0);
              assert.ok(result.svg.includes(svg.themes[theme].background));
            }
          });
          test('right-edge release numbers leave room before their diamond marker', () => {
            for (const layout of ['wide', 'compact']) {
              const value = inputs();
              value.snapshot.projects.projects = [release('v-last', '2026-01-17T12:00:00Z')];
              const doc = parseSceneXml(render(value, {layout}).svg), width = layout === 'compact' ? 480 : 720;
              const visit = node => {
                if (node.name === 'text' && /^\d$/.test(sceneVisibleText(node))) assert.ok(Number(node.attrs.x) <= width - 48);
                for (const child of node.children) visit(child);
              };
              visit(doc.root);
            }
          });
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          assert.ok(!p.scripts['test:github'].includes('tests/terrain-route.test.ts'));
          p.scripts['test:github']=p.scripts['test:github'].replace('tests/scene-route.test.ts','tests/scene-route.test.ts tests/terrain-route.test.ts');
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          for(const path of ['app/page.tsx','docs/PRODUCT_DIRECTION.md']) {
            let s=fs.readFileSync(path,'utf8'); assert.equal(s.split('nine hosted SVG routes').length,2);
            fs.writeFileSync(path,s.replace('nine hosted SVG routes','ten hosted SVG routes'));
          }
          JS
          git add -- packages/svg/src/scenes/activity-terrain.ts packages/svg/tests/activity-terrain-boundaries.test.mjs package.json app/page.tsx docs/PRODUCT_DIRECTION.md
          git commit -m 'fix(svg): bound unavailable terrain and verify hosted two-year output'
          mkdir -p terrain-preview
          git rev-parse HEAD > terrain-preview/checkout.txt
      - run: npm ci --no-audit --no-fund
      - run: npm run build:action
      - name: Record regenerated Action before its reproducibility gate
        run: |
          git add -- action/dist
          if ! git diff --cached --quiet; then git commit -m 'build(action): retain bounded terrain unavailable rendering'; fi
      - name: Run the complete repository gate
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee terrain-preview/full-check.log
      - name: Retain exact source and built modules
        if: always()
        run: |
          mkdir -p terrain-preview
          tar -czf terrain-preview/packages.tgz packages scripts package.json tsconfig.json node_modules/zod
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: terrain-final-321
          path: terrain-preview/
          retention-days: 14
      - name: Publish only after the complete gate succeeds
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
          remote_head=$(git ls-remote origin refs/heads/grok/activity-terrain-135 | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/grok/activity-terrain-135
