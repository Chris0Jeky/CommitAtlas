name: Temporary review history export
on:
  push:
    branches: [diagnostic/workspace-20261007]
    paths: [.github/workflows/export-review-history.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/diagnostic/workspace-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b8acb2e83aad82d56e3c05050bf48f8f5dd67f6
          fetch-depth: 0
          persist-credentials: false
      - name: Export only the selected repository histories, never configuration or credentials
        run: |
          set -euo pipefail
          mkdir -p /tmp/commitatlas-review-history
          git bundle create /tmp/commitatlas-review-history/history.bundle HEAD refs/remotes/origin/fix/lifecycle-evidence-137 refs/remotes/origin/grok/studio-motion-lab-141 refs/remotes/origin/grok/chronograph-136
          git bundle verify /tmp/commitatlas-review-history/history.bundle
          git bundle list-heads /tmp/commitatlas-review-history/history.bundle > /tmp/commitatlas-review-history/refs.txt
          sha256sum /tmp/commitatlas-review-history/history.bundle > /tmp/commitatlas-review-history/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commitatlas-review-history
          path: /tmp/commitatlas-review-history/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
