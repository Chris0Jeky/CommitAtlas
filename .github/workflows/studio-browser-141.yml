name: Temporary production Studio browser QA
on:
  push:
    branches: [diagnostic/studio-browser-141]
    paths: [.github/workflows/studio-browser-141.yml]
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/diagnostic/studio-browser-141'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bb3c1d659ab703c83b7a15fbd731e1c3140aeb39
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          package-manager-cache: false
      - name: Use the installed runner Chrome with a pinned isolated driver
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          npm install --prefix "$RUNNER_TEMP/studio-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
      - name: Exercise the fixed production origin with synthetic evidence only
        env:
          GITHUB_TOKEN: ''
          STUDIO_QA_MODE: production
        run: |
          set -euo pipefail
          mkdir -p .studio-qa
          export PLAYWRIGHT_PREFIX="$RUNNER_TEMP/studio-browser"
          export CHROME_BIN="$(command -v google-chrome)"
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 24; attempt++) {
            try {
              const response = await fetch('https://commit-atlas.commit-atlas.workers.dev/api/v1/scenes/evidence-coverage.svg?user=octocat&demo=true');
              if (response.ok && response.headers.has('x-commitatlas-scene-metadata')) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!ready) throw new Error('Deployed renderer metadata did not become ready');
          JS
          node tests/studio-scene-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-production-browser
          path: .studio-qa/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
