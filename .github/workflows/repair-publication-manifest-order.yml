name: Repair publication manifest order

on:
  push:
    branches: [fix/publication-global-manifest-order]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/publication-global-manifest-order
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci

      - name: Apply the pure recovery-order repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/static/src/publication-protocol.ts')
          source = path.read_text(encoding='utf-8')
          old = '  const ordered = direction === "rollback" ? [...classified].reverse() : classified;'
          new = '''  const payloads = classified.filter(({ operation }) => operation.name !== "manifest.json");
          const manifests = classified.filter(({ operation }) => operation.name === "manifest.json");
          const ordered = direction === "rollback"
            ? [...payloads].reverse().concat([...manifests].reverse())
            : payloads.concat(manifests);'''
          if source.count(old) != 1:
              raise SystemExit('unexpected recovery ordering shape')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

      - name: Verify focused repair and rebuild the Action
        run: |
          npm run typecheck
          npm --prefix packages/static test
          npm run build:action

      - name: Commit durable source, tests, and bundle
        run: |
          rm .github/workflows/repair-publication-manifest-order.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/static/src/publication-protocol.ts packages/static/tests/publication-manifest-order.test.mjs packages/static/package.json action/dist .github/workflows/repair-publication-manifest-order.yml
          git commit -m "fix(static): keep recovery manifests globally last"
          git push origin HEAD:fix/publication-global-manifest-order
