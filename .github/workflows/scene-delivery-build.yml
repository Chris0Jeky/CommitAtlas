name: Temporary scene delivery build
on:
  push:
    branches: [feat/static-scene-delivery]
permissions:
  contents: write
concurrency:
  group: temporary-scene-delivery-build
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/static-scene-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply bounded implementation patches and documentation
        run: |
          git apply --check --index .scene-core.patch
          git apply --index .scene-core.patch
          git apply --check --index .scene-typecheck.patch .scene-tests.patch
          git apply --index .scene-typecheck.patch .scene-tests.patch
          cat .scene-docs.md >> docs/STATIC_GENERATOR_PLAN.md
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          marker = '## License\n'
          assert text.count(marker) == 1
          addition = '''### Static scene configuration

          Static config v1 accepts `scenes: []`, `scenePack: "survey"`, and optional
          bounded `identity` text. Defaults preserve existing card artifacts. Only
          registered scenes may be selected; the production registry remains empty
          until scene-specific implementations land. Selected scenes render from one
          snapshot for every configured theme, with hashes in the existing manifest.
          The Action's `scenes` output is a JSON array of generated paths (`[]` when
          disabled), including during dry-run.

          ```json
          { "scenes": [], "scenePack": "survey", "identity": { "name": "Synthetic owner", "focus": ["Software"] } }
          ```

          Add these fields to an existing complete config. Update any exact consumer
          artifact allowlist with selected `scene-<id>.svg` names before enabling them.
          See [the scene delivery contract](docs/STATIC_GENERATOR_PLAN.md#registered-scene-delivery)
          for identity limits, ownership rules and paired-theme behavior.

          '''
          p.write_text(text.replace(marker, addition + marker))
          PY
          git add -- README.md docs/STATIC_GENERATOR_PLAN.md
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Validate source and static integration
        run: npm run typecheck && npm run lint && npm run test:static
      - name: Rebuild and check Action bundle
        run: npm run build:action && node --test action/action.test.mjs
      - name: Commit only this branch's validated implementation and generated bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- action/dist
          git rm -- .scene-core.patch .scene-typecheck.patch .scene-tests.patch .scene-docs.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat(static): integrate registered scenes and rebuild the Action bundle'
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/feat/static-scene-delivery
