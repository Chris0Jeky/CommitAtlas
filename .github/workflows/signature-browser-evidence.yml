name: Signature browser evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - packages/svg/**
      - packages/core/src/lens-projection.ts
      - research-contracts/lens-projection/**
      - tests/signature-*.mjs
      - tests/motion-probes/capture.mjs
      - .github/workflows/signature-browser-evidence.yml

permissions:
  contents: read

concurrency:
  group: signature-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SIGNATURE_EXPECTED_BROWSER_VERSION: 143.0.7499.4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Install the pinned browser and actual Unicode fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/signature-playwright" --ignore-scripts playwright@1.57.0
          node "$RUNNER_TEMP/signature-playwright/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-noto-cjk fonts-noto-color-emoji
          SIGNATURE_CHROMIUM=$(node --input-type=commonjs -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/signature-playwright/node_modules/playwright")
          printf 'CHROME_BIN=%s\n' "$SIGNATURE_CHROMIUM" >> "$GITHUB_ENV"
      - name: Measure layout and timed synthetic SVG playback
        env:
          PLAYWRIGHT_PREFIX: ${{ runner.temp }}/signature-playwright
          SIGNATURE_QA_OUTPUT: ${{ runner.temp }}/signature-evidence
        run: node tests/signature-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signature-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/signature-evidence
          if-no-files-found: error
          retention-days: 14
