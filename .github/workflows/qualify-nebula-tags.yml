name: Qualify nebula tag compatibility
on:
  push:
    branches: [test/nebula-tag-compatibility-followup-20261012]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Pin source identity and install the lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tag-proof"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = f15236a5a0a540e8dca939cca59d7d4e38222120
          {
            printf 'SOURCE_HEAD=%s\nSOURCE_TREE=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})"
            node --version
            npm --version
            git ls-tree HEAD packages/svg/src/scenes/nebula.ts
            sha256sum package-lock.json packages/svg/src/scenes/nebula.ts packages/svg/tests/scenes/nebula.test.mjs packages/svg/tests/nebula-tag-compatibility.test.mjs
          } | tee "$RUNNER_TEMP/tag-proof/source.txt"
          npm ci 2>&1 | tee "$RUNNER_TEMP/tag-proof/install.log"
      - name: Reproduce expanded compatibility tests against the previous renderer
        shell: bash
        run: |
          set -euo pipefail
          file=packages/svg/src/scenes/nebula.ts
          cp "$file" "$RUNNER_TEMP/candidate-nebula.ts"
          git show HEAD^:"$file" > "$file"
          test "$(git hash-object "$file")" = 7a046d5a419ec6e47a10823fa98743bd9adfdfd6
          npm --prefix packages/svg run build > "$RUNNER_TEMP/tag-proof/red-build.log" 2>&1
          set +e
          node --test --test-concurrency=2 packages/svg/tests/nebula-tag-compatibility.test.mjs > "$RUNNER_TEMP/tag-proof/red.log" 2>&1
          status=$?
          set -e
          test "$status" = 1
          grep -E 'not ok .*nebula retains slash' "$RUNNER_TEMP/tag-proof/red.log"
          grep -E 'not ok .*nebula retains CJK' "$RUNNER_TEMP/tag-proof/red.log"
          grep -E 'not ok .*nebula retains 200 astral' "$RUNNER_TEMP/tag-proof/red.log"
          cp "$RUNNER_TEMP/candidate-nebula.ts" "$file"
          git diff --exit-code
      - name: Rebuild and run complete locked verification
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packages/svg run build > "$RUNNER_TEMP/tag-proof/green-build.log" 2>&1
          node --test --test-concurrency=2 packages/svg/tests/nebula-tag-compatibility.test.mjs 2>&1 | tee "$RUNNER_TEMP/tag-proof/green.log"
          exec > >(tee "$RUNNER_TEMP/tag-proof/check.log") 2>&1
          npm run build:action
          git config user.name 'CommitAtlas qualification'
          git config user.email 'qualification@users.noreply.github.com'
          git add action/dist
          if ! git diff --cached --quiet; then git commit -m 'Local-only qualified Action bundle'; fi
          npm run check
          npm audit --omit=dev --audit-level=high
          test -z "$(git status --porcelain)"
      - name: Preserve verified bundle blobs without moving a ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$GITHUB_SHA" HEAD -- action/dist | while IFS= read -r file; do
            test -f "$file"
            python3 - "$file" "$RUNNER_TEMP/tag-blob.json" <<'PY'
          import base64, json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'encoding': 'base64', 'content': base64.b64encode(path.read_bytes()).decode()}))
          PY
            sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/tag-blob.json" --jq '.sha')
            test "$sha" = "$(git hash-object "$file")"
            printf 'VERIFIED_BLOB %s %s\n' "$file" "$sha" | tee -a "$RUNNER_TEMP/tag-proof/bundle.txt"
          done
          printf 'QUALIFIED_SOURCE_HEAD=%s\n' "$GITHUB_SHA" | tee -a "$RUNNER_TEMP/tag-proof/bundle.txt"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nebula-tag-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/tag-proof
          retention-days: 14
          if-no-files-found: error
