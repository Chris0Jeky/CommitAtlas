name: Temporary evidence scene workspace
on:
  push:
    branches: [feat/evidence-coverage-scene]
permissions:
  contents: read
jobs:
  workspace:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/evidence-coverage-scene'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - name: Preserve public source and bounded runtime dependencies without credentials
        run: |
          mkdir /tmp/scene-workspace
          git rev-parse HEAD > /tmp/scene-workspace/source-sha.txt
          git ls-tree -r HEAD > /tmp/scene-workspace/source-tree.txt
          git archive --format=tar.gz HEAD > /tmp/scene-workspace/source.tar.gz
          tar -czf /tmp/scene-workspace/runtime.tar.gz node_modules/zod node_modules/typescript node_modules/@types/node node_modules/undici-types node_modules/@commit-atlas packages/core/dist packages/github/dist packages/svg/dist packages/static/dist
          cd /tmp/scene-workspace
          sha256sum source.tar.gz runtime.tar.gz > sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-scene-workspace
          path: /tmp/scene-workspace/*
          retention-days: 3
          if-no-files-found: error
