name: Apply static destination preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/static-publication-preflight' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/static-publication-preflight

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply destination preflight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('packages/static/src/generate.ts')
          text = source.read_text()
          old_calls = '''    // Detect a caller-replaced directory before deleting any stale file in any theme. Missing files
              // are fine (the previous manifest can outlive a manual deletion), while directories are not a
              // valid CommitAtlas artifact and make non-recursive cleanup fail.
              for (const target of prepared) await verifyStaleArtifacts(target);
          '''
          new_calls = '''    // Preflight every visible destination across every theme before cleanup or the first rename.
              // Existing regular files are valid replacement targets; missing files are new artifacts. A
              // directory, symlink, or other special entry would make a later rename fail after an earlier
              // theme had already committed, so reject the whole publication while only temp files exist.
              for (const target of prepared) await verifyCurrentDestinations(target);

              // Detect a caller-replaced directory before deleting any stale file in any theme. Missing files
              // are fine (the previous manifest can outlive a manual deletion), while directories are not a
              // valid CommitAtlas artifact and make non-recursive cleanup fail.
              for (const target of prepared) await verifyStaleArtifacts(target);
          '''
          if old_calls not in text:
              raise SystemExit('publication preflight call anchor missing')
          text = text.replace(old_calls, new_calls, 1)

          helper_anchor = '''async function verifyStaleArtifacts(target: PreparedArtifacts): Promise<void> {
          '''
          helper = '''async function verifyCurrentDestinations(target: PreparedArtifacts): Promise<void> {
            for (const file of [...target.payloads, target.manifest]) {
              try {
                const metadata = await lstat(file.destination);
                if (!metadata.isFile()) {
                  throw new Error(`${path.basename(file.destination)} is not a regular artifact file`);
                }
              } catch (error) {
                if ((error as NodeJS.ErrnoException).code !== "ENOENT") throw error;
              }
            }
          }

          async function verifyStaleArtifacts(target: PreparedArtifacts): Promise<void> {
          '''
          if helper_anchor not in text:
              raise SystemExit('stale preflight helper anchor missing')
          source.write_text(text.replace(helper_anchor, helper, 1))
          PY

      - name: Verify focused static package
        run: npm --prefix packages/static test

      - name: Rebuild tracked Action bundle
        run: npm run build:action

      - name: Commit source, tests, and generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-static-destination-preflight.yml
          git add packages/static/src/generate.ts action/dist
          git commit -m "fix(static): preflight every artifact destination"
          git push origin HEAD:fix/static-publication-preflight
