# Temporary read-only verification transport. Remove before merging this PR.
name: Recovery evidence
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/static-cli-import-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Export public source and locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/commitatlas-recovery
          git archive --format=tar.gz 30f542be6d9c5b57d94501023c432829a2ad3638 > /tmp/commitatlas-recovery/motion-source.tar.gz
          git archive --format=tar.gz e1a423421eaeab32320e9f95bd456203bebd59f2 > /tmp/commitatlas-recovery/pulse-source.tar.gz
          git archive --format=tar.gz 24d8b0a3310aeeec6153ddf6de39e1c5f5c8f53c > /tmp/commitatlas-recovery/delivery-source.tar.gz
          git archive --format=tar.gz 7e96da1e5fa7b0356bddafe25331d0ce017549c0 > /tmp/commitatlas-recovery/motion-base.tar.gz
          git archive --format=tar.gz 223202aab75292452ffb81537e180d5fac9139cc > /tmp/commitatlas-recovery/pulse-base.tar.gz
          node --input-type=module <<'JS'
          import { existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const packages = ['zod','typescript','tsx','esbuild','@esbuild','get-tsconfig','resolve-pkg-maps'];
          const paths = packages.map(name => `node_modules/${name}`).filter(existsSync);
          execFileSync('tar', ['-czf', '/tmp/commitatlas-recovery/test-dependencies.tar.gz', ...paths]);
          JS
          sha256sum /tmp/commitatlas-recovery/* > /tmp/commitatlas-recovery/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: commitatlas-recovery-${{ github.event.pull_request.head.sha }}
          path: /tmp/commitatlas-recovery/
          retention-days: 2
      - run: npm run build:static
      - name: Prove the CLI import regression
        run: node --test packages/static/tests/entrypoint.test.mjs
