name: Qualify beacon evidence repair
on:
  push:
    branches: [fix/identity-beacon-evidence-346-20261012]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Pin the input and preserve its identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/beacon-proof"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            printf 'SOURCE_HEAD=%s\nSOURCE_TREE=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})"
            sha256sum package-lock.json packages/svg/src/scenes/identity-beacon.ts packages/svg/tests/identity-beacon.test.mjs packages/static/tests/identity-beacon.test.mjs packages/svg/src/scenes/nebula.ts
          } | tee "$RUNNER_TEMP/beacon-proof/source.txt"
          sha256sum --check <<'HASHES'
          11e0f861c8dc5047f41040c71eb155a9b04266735baa63b6b42d575607a612e4  package-lock.json
          82b1eea6bb294f98dbafd11eafe92da21071be6cbf59a41be977697525429907  packages/svg/src/scenes/identity-beacon.ts
          1b0cca9caab4077367dfaf2ba7ebb9b58ee4ee73bcc71b12de21e0cc450e3692  packages/svg/tests/identity-beacon.test.mjs
          063f77ed947b8a8c022157994e1111c1711d7987565a8c2f2cdcd7cb1cc86c0f  packages/static/tests/identity-beacon.test.mjs
          0d30aaa5025d78e66354ae0d9e026a9cfa896c4cb7ee49537226e51568676ea5  packages/svg/src/scenes/nebula.ts
          HASHES
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install exact locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee "$RUNNER_TEMP/beacon-proof/versions.txt"
          npm --version | tee -a "$RUNNER_TEMP/beacon-proof/versions.txt"
          npm ci 2>&1 | tee "$RUNNER_TEMP/beacon-proof/install.log"
      - name: Rebuild bundle and run the complete gate
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/beacon-proof/check.log") 2>&1
          npm run build:action
          git config user.name 'CommitAtlas qualification'
          git config user.email 'qualification@users.noreply.github.com'
          git add action/dist
          if ! git diff --cached --quiet; then git commit -m 'Local-only verified Action bundle'; fi
          npm run check
          npm audit --omit=dev --audit-level=high
          test -z "$(git status --porcelain)"
      - name: Preserve verified bundle blobs without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$GITHUB_SHA" HEAD -- action/dist | while IFS= read -r file; do
            test -f "$file"
            python3 - "$file" "$RUNNER_TEMP/beacon-blob.json" <<'PY'
          import base64, json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'encoding':'base64','content':base64.b64encode(p.read_bytes()).decode()}))
          PY
            sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/beacon-blob.json" --jq '.sha')
            test "$sha" = "$(git hash-object "$file")"
            printf 'VERIFIED_BLOB %s %s\n' "$file" "$sha" | tee -a "$RUNNER_TEMP/beacon-proof/bundle.txt"
          done
          printf 'QUALIFIED_SOURCE_HEAD=%s\n' "$GITHUB_SHA" | tee -a "$RUNNER_TEMP/beacon-proof/bundle.txt"
      - name: Retain evidence even for a failed attempt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: beacon-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/beacon-proof
          retention-days: 14
          if-no-files-found: error
