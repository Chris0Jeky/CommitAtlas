name: Qualify beacon evidence repair
on:
  push:
    branches: [fix/identity-beacon-evidence-346-20261012]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify reconciled input bytes before qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'SOURCE_HEAD=%s\n' "$GITHUB_SHA"
          sha256sum --check <<'HASHES'
          11e0f861c8dc5047f41040c71eb155a9b04266735baa63b6b42d575607a612e4  package-lock.json
          f2f73f706599e9956d06982abed9053d2803956f816bb8bcbe89a2cc0c4c7352  packages/svg/src/scenes/identity-beacon.ts
          1abcff7121a553d2966e263632a39bbf4ca7e45f78309261d0e44bb1368b8817  packages/svg/tests/identity-beacon.test.mjs
          HASHES
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Rebuild and verify the exact source
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm run build:action
          git config user.name 'CommitAtlas qualification'
          git config user.email 'qualification@users.noreply.github.com'
          git add action/dist
          if ! git diff --cached --quiet; then git commit -m 'build(action): regenerate qualified beacon bundle'; fi
          npm run check
          npm audit --omit=dev --audit-level=high
      - name: Publish only the verified bundle with an exact source lease
        shell: bash
        run: |
          set -euo pipefail
          branch='fix/identity-beacon-evidence-346-20261012'
          test "$GITHUB_REF" = "refs/heads/$branch"
          test -z "$(git status --porcelain)"
          if test "$(git rev-parse HEAD)" != "$GITHUB_SHA"; then
            test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
            test "$(git diff --name-only "$GITHUB_SHA" HEAD)" = 'action/dist/index.js'
            git push --force-with-lease="refs/heads/$branch:$GITHUB_SHA" origin "HEAD:refs/heads/$branch"
          fi
          printf 'QUALIFIED_SOURCE_HEAD=%s\nBUNDLED_HEAD=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD)"
          printf 'BUNDLE_BLOB=%s\n' "$(git rev-parse HEAD:action/dist/index.js)"
