name: Dependency audit evidence 325
on:
  push:
    branches: [audit/dependency-paths-325-20261007]
    paths: [.github/workflows/dependency-audit-325.yml]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cea038bd45c0c1204874ca177e184aae22f1c0b4
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
      - name: Install the pinned dependency graph without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Retain both audit scopes and resolved dependency paths
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          fs.mkdirSync('audit-evidence');
          const sha = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const receipt = {sourceCommit:'cea038bd45c0c1204874ca177e184aae22f1c0b4',capturedAt:new Date().toISOString(),node:process.version,npm:spawnSync('npm',['--version'],{encoding:'utf8'}).stdout.trim(),lockfileSha256:sha('package-lock.json'),scopes:{}};
          for (const [scope,args] of [['full',[]],['production',['--omit=dev']]]) {
            const result = spawnSync('npm',['audit','--json',...args],{encoding:'utf8',timeout:180000,maxBuffer:8*1024*1024});
            if(result.error || result.signal || ![0,1].includes(result.status)) throw new Error(`Audit command failed: ${scope}`);
            const report = JSON.parse(result.stdout);
            if(report.error || report.auditReportVersion !== 2 || !report.metadata || !report.vulnerabilities) throw new Error(`Invalid audit result: ${scope}`);
            const path = `audit-evidence/${scope}.json`;
            fs.writeFileSync(path,result.stdout);
            receipt.scopes[scope] = {exitCode:result.status,sha256:sha(path),counts:report.metadata.vulnerabilities};
            for (const [name,v] of Object.entries(report.vulnerabilities)) {
              console.log(JSON.stringify({scope,name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via,effects:v.effects,nodes:v.nodes.map(path=>({path,version:lock.packages[path]?.version,dev:lock.packages[path]?.dev}))}));
            }
            console.log(JSON.stringify({scope,summary:receipt.scopes[scope]}));
          }
          fs.writeFileSync('audit-evidence/receipt.json',JSON.stringify(receipt,null,2)+'\n');
          fs.copyFileSync('package-lock.json','audit-evidence/package-lock.json');
          const names = Object.keys(JSON.parse(fs.readFileSync('audit-evidence/full.json','utf8')).vulnerabilities);
          for (const name of names) {
            const result = spawnSync('npm',['explain',name,'--json'],{encoding:'utf8',timeout:15000,maxBuffer:4*1024*1024});
            if(result.error || result.signal || result.status !== 0) throw new Error(`Dependency explanation failed: ${name}`);
            JSON.parse(result.stdout);
            fs.writeFileSync(`audit-evidence/explain-${name.replaceAll('/','_').replaceAll('@','')}.json`,result.stdout);
          }
          console.log(JSON.stringify({receipt}));
          JS
      - name: Upload immutable audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-audit-325
          path: audit-evidence/
          if-no-files-found: error
          retention-days: 30
