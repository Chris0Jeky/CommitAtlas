name: Temporary card preview integration
on:
  push:
    branches: [fix/card-preview-evidence-141]
    paths: [.github/workflows/integrate-card-141.yml]
permissions:
  contents: read
concurrency:
  group: card-integration-141
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/fix/card-preview-evidence-141'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source: ${{ steps.publish.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
      - name: Reconstruct only literal edits against verified base blobs
        run: |
          python3 <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.card-integration/part-{number}.b64').read_text() for number in range(1,4))
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '2bb1a7850bc1d4dfeba884d5fc5d7a28028ddf677e11ba7624b1dd4cd13043ab'
          data = gzip.decompress(packed)
          assert hashlib.sha256(data).hexdigest() == 'c357238c31a82b60c96ddda3c07f7aade533fa42ad288a99cf37aa08c9e8bff0'
          records = json.loads(data)
          assert len(records) == 28
          seen = set()
          for record in records:
              target = pathlib.Path(record['path'])
              assert not target.is_absolute() and '..' not in target.parts and str(target) not in seen and not target.is_symlink()
              seen.add(str(target))
              if record['base'] is None:
                  assert not target.exists()
                  lines = []
              else:
                  original = target.read_bytes()
                  assert hashlib.sha1(f'blob {len(original)}\0'.encode() + original).hexdigest() == record['base'], str(target)
                  lines = original.decode().splitlines(keepends=True)
              output, cursor = [], 0
              for start, end, text in record['edits']:
                  assert cursor <= start <= end <= len(lines) and isinstance(text, str)
                  output.extend(lines[cursor:start]); output.append(text); cursor = end
              output.extend(lines[cursor:])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(''.join(output).encode())
              subprocess.run(['git','add','--',str(target)],check=True)
          PY
          git rm -r -- .card-integration .github/workflows/integrate-card-141.yml
          git diff --cached --check
      - run: npm ci
      - run: npm run build:action
      - name: Commit the exact reviewed tree for the reproducibility gate
        run: |
          set -euo pipefail
          git add -- action/dist
          test "$(git write-tree)" = 9c122637fc6abe15dc08d94731b57306984692e6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(studio): verify all card previews before exporting Markdown'
      - run: npm run check
      - name: Publish only the proven tree without force-pushing
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = 9c122637fc6abe15dc08d94731b57306984692e6
          remote_head=$(git ls-remote origin refs/heads/fix/card-preview-evidence-141 | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/card-preview-evidence-141
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Reviewed tree 9c122637fc6abe15dc08d94731b57306984692e6; clean source %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  browser:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Use an isolated exact driver and installed runner browser
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          npm install --prefix "$RUNNER_TEMP/studio-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
      - name: Exercise the built Worker and retained React fixture
        env:
          GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          mkdir -p .studio-qa
          export PLAYWRIGHT_PREFIX="$RUNNER_TEMP/studio-browser"
          export CHROME_BIN="$(command -v google-chrome)"
          node --import ./tests/register-cloudflare-workers-loader.mjs tests/studio-browser-server.mjs > .studio-qa/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt=0; attempt<30; attempt++) {
            try { if ((await fetch('http://127.0.0.1:3471/studio')).ok) { ready=true; break; } } catch {}
            await new Promise(resolve=>setTimeout(resolve,1000));
          }
          if (!ready) throw new Error('Built Worker adapter did not become ready');
          JS
          node tests/studio-scene-browser.mjs
          node tests/studio-preview.browser.mjs --playwright-cli "$PLAYWRIGHT_PREFIX/node_modules/playwright/cli.js" --browser-executable "$CHROME_BIN" > .studio-qa/isolated-react.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: card-and-scene-browser
          path: .studio-qa/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
