name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the repository gate
        run: npm run check

      - name: Diagnose generated server bundle
        if: always()
        run: |
          if [ -f dist/server/index.js ]; then
            node scripts/assert-node-importable-server-bundle.mjs
          else
            echo "dist/server/index.js was not produced"
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
