name: Density browser evidence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - packages/svg/**
      - tests/density-browser.mjs
      - .github/workflows/density-browser-evidence.yml

permissions:
  contents: read

concurrency:
  group: density-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@commit-atlas/svg
      - name: Install external pinned browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/density-playwright" --ignore-scripts playwright@1.57.0
          node "$RUNNER_TEMP/density-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Measure layouts, visible playback and reduced-motion controls
        env:
          PLAYWRIGHT_PREFIX: ${{ runner.temp }}/density-playwright
          DENSITY_QA_OUTPUT: ${{ runner.temp }}/density-evidence
        run: node tests/density-browser.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: density-browser-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/density-evidence
          if-no-files-found: error
          retention-days: 14
