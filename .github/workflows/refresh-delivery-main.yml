# Temporary branch-only reconciliation. Remove before final review of PR #227.
name: Refresh delivery on reviewed main
on:
  push:
    branches: [feat/public-delivery-evidence]
    paths: [.github/workflows/refresh-delivery-main.yml]
permissions:
  contents: write
concurrency:
  group: refresh-delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/public-delivery-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Reconcile reviewed motion and pulse changes without losing delivery safeguards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = cd74945d49546e046965611ec0ae2a5c941f7de0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 9c0aad155fc79989a72eadc36050ac1a74386598 || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import json, pathlib, subprocess
          main = '9c0aad155fc79989a72eadc36050ac1a74386598'
          head = 'cd74945d49546e046965611ec0ae2a5c941f7de0'
          def show(ref, path):
              return subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)
          conflicts = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines())
          allowed = {'package.json','packages/svg/src/index.ts','action/dist/index.js'}
          if not conflicts <= allowed:
              raise SystemExit(f'Unreviewed merge conflicts: {sorted(conflicts - allowed)}')
          package = json.loads(show(main, 'package.json'))
          old = 'lib/http.test.ts'
          if package['scripts']['test:github'].count(old) != 1:
              raise SystemExit('Unexpected main test command')
          package['scripts']['test:github'] = package['scripts']['test:github'].replace(old, 'packages/github/src/delivery.test.ts packages/github/src/delivery-client.test.ts ' + old)
          pathlib.Path('package.json').write_text(json.dumps(package, indent=2) + '\n')
          # The two independently added card families share insertion points. Start
          # with exact reviewed main, then retain only delivery's original additions.
          path = 'packages/svg/src/index.ts'
          original = show(head, path)
          combined = show(main, path)
          type_start = 'export interface DeliveryCardWindow {'
          type_end = 'export interface AtlasCardData {'
          function_start = 'const DELIVERY_WINDOW_ORDER ='
          function_end = '/** Render the compact, source-labelled CommitAtlas overview card. */'
          for anchor in [type_start,type_end,function_start,function_end]:
              if original.count(anchor) != 1:
                  raise SystemExit(f'Unexpected delivery source anchor: {anchor}')
          types = original[original.index(type_start):original.index(type_end)]
          functions = original[original.index(function_start):original.index(function_end)]
          for anchor in ['export type PulseProbeState =','const PULSE_TIMESTAMP_PATTERN =','export const renderProjectSignalBoard = renderProjectBoard;']:
              if combined.count(anchor) != 1:
                  raise SystemExit(f'Unexpected main source anchor: {anchor}')
          combined = combined.replace('export type PulseProbeState =', types + 'export type PulseProbeState =', 1)
          combined = combined.replace('const PULSE_TIMESTAMP_PATTERN =', functions + 'const PULSE_TIMESTAMP_PATTERN =', 1)
          combined = combined.replace('export const renderProjectSignalBoard = renderProjectBoard;', 'export const renderProjectSignalBoard = renderProjectBoard;\nexport const renderDelivery = renderDeliveryCard;', 1)
          pathlib.Path(path).write_text(combined)
          expected = 'bd8edf29fdb3a04e3726f40d558728536557a3fd'
          if subprocess.check_output(['git','hash-object',path], text=True).strip() != expected:
              raise SystemExit('Combined SVG differs from the locally reviewed/tested candidate')
          path = pathlib.Path('packages/static/src/delivery.ts')
          text = path.read_text()
          replacements = {
              'import { themes, type ThemeName } from "@commit-atlas/svg";': 'import { themes, type MotionProfile, type ThemeName } from "@commit-atlas/svg";',
              'readonly motion?: "none" | "subtle";': 'readonly motion?: MotionProfile;',
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit('Delivery motion type changed; refusing unreviewed replacement')
              text = text.replace(before, after)
          path.write_text(text)
          if subprocess.check_output(['git','hash-object',str(path)], text=True).strip() != '06762e2f3429d36f8bdf243dc791b8ba51d99aa4':
              raise SystemExit('Static delivery differs from tested candidate')
          if 'action/dist/index.js' in conflicts:
              subprocess.run(['git','checkout','--ours','--','action/dist/index.js'], check=True)
          subprocess.run(['git','add','package.json','packages/svg/src/index.ts','packages/static/src/delivery.ts','action/dist/index.js'], check=True)
          if subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).strip():
              raise SystemExit('Unresolved conflicts remain')
          PY
      - run: npm ci
      - name: Rebuild the tracked distribution and seal the merge candidate
        run: |
          npm run build:action
          git add action/dist/index.js
          git diff --cached --check
          git commit -m 'merge: reconcile delivery with reviewed motion, pulse and CLI safeguards'
      - name: Verify the complete candidate without waiving acceptance blockers
        run: npm run check && npm audit --omit=dev --audit-level=high
      - name: Publish only a verified fast-forward of this draft branch
        run: git push origin HEAD:refs/heads/feat/public-delivery-evidence
