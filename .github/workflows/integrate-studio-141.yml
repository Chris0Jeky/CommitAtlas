name: Temporary Studio integration and browser QA
on:
  push:
    branches: [fix/studio-preview-evidence-141]
    paths: [.github/workflows/integrate-studio-141.yml]
permissions:
  contents: read
concurrency:
  group: studio-integration-141
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/fix/studio-preview-evidence-141'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source: ${{ steps.publish.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply only literal edits against verified source blobs
        run: |
          python3 <<'PY'
          import ast, hashlib, pathlib, subprocess
          seen = set()
          expected = ['0766aa8d6e505c2eac3d4c2a6a790f8ac4a7dfd8', 'a6f3e2f9252d78ba68fab65af9e0ce727a3e6f40', 'be99f29ed0d042fb6dd43baf55dbcf23572bb2fc', '6fa330679695b7fc745e85ef88ef650da7fb9890']
          def blob(data):
              return hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
          for number, digest in enumerate(expected, 1):
              source = pathlib.Path(f'.studio-integration/part-{number}.py').read_bytes()
              assert blob(source) == digest
              for statement in ast.parse(source.decode('utf-8')).body:
                  assert isinstance(statement, ast.Expr) and isinstance(statement.value, ast.Call)
                  call = statement.value
                  assert isinstance(call.func, ast.Name) and call.func.id == 'edit' and not call.keywords and len(call.args) == 3
                  filename, previous, edits = map(ast.literal_eval, call.args)
                  target = pathlib.Path(filename)
                  assert not target.is_absolute() and '..' not in target.parts and filename not in seen and not target.is_symlink()
                  seen.add(filename)
                  if previous is None:
                      assert not target.exists()
                      lines = []
                  else:
                      original = target.read_bytes()
                      assert blob(original) == previous, f'Unreconciled source: {filename}'
                      lines = original.decode('utf-8').splitlines(keepends=True)
                  output, cursor = [], 0
                  for start, end, text in edits:
                      assert cursor <= start <= end <= len(lines) and isinstance(text, str)
                      output.extend(lines[cursor:start]); output.append(text); cursor = end
                  output.extend(lines[cursor:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(''.join(output).encode('utf-8'))
                  subprocess.run(['git', 'add', '--', filename], check=True)
          assert len(seen) == 23
          PY
          git rm -r -- .studio-integration .github/workflows/integrate-studio-141.yml
          test "$(git write-tree)" = 4335aa2cc5992b56578df8f08e393f135998377a
          git diff --cached --check
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test:studio && npm run test:github && npm run test:deploy-tooling
      - name: Publish the exact reviewed source tree without force-pushing
        id: publish
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git write-tree)" = 4335aa2cc5992b56578df8f08e393f135998377a
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(studio): bind scene copying to decoded previews and renderer metadata'
          remote_head=$(git ls-remote origin refs/heads/fix/studio-preview-evidence-141 | cut -f1)
          test "$remote_head" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/studio-preview-evidence-141
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'Reviewed tree 4335aa2cc5992b56578df8f08e393f135998377a, integrated source %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
  browser:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.integrate.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Use the runner browser with an isolated exact-version driver
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          npm install --prefix "$RUNNER_TEMP/studio-browser" --no-save --ignore-scripts --no-audit --no-fund playwright@1.57.0
      - name: Exercise synthetic HTTPS previews, errors, keyboard and layout
        env:
          GITHUB_TOKEN: ''
        run: |
          set -euo pipefail
          mkdir -p .studio-qa
          export PLAYWRIGHT_PREFIX="$RUNNER_TEMP/studio-browser"
          export CHROME_BIN="$(command -v google-chrome)"
          npm run dev -- --host 127.0.0.1 --port 3471 > .studio-qa/dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 60; attempt++) {
            try { const response = await fetch('http://127.0.0.1:3471/studio'); if (response.ok) { ready = true; break; } } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('Studio dev server did not become ready');
          JS
          node tests/studio-scene-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-preview-browser
          path: .studio-qa/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
