name: Temporary scene policy proof
on:
  push:
    branches: [feat/static-scene-delivery]
permissions:
  contents: write
concurrency:
  group: temporary-scene-policy-build
  cancel-in-progress: false
jobs:
  proof:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/static-scene-delivery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply the bounded review repairs and their reproduced regressions
        run: |
          cat .scene-policy-tests.inc >> packages/static/tests/scenes.test.mjs
          git apply --check --index .scene-policy.patch
          git apply --index .scene-policy.patch
          cat >> docs/STATIC_GENERATOR_PLAN.md <<'DOC'

          Scene delivery uses `MOTION_BACKEND_DEFAULTS["github-readme"]` rather than
          forcing the web/CSS backend. That policy is still provisional; it is not
          browser qualification, and consumers remain responsible for the existing
          reduced-motion/none-twin delivery requirements. Validated scene artifacts
          use the engine's scene byte ceiling (currently 120 KiB); individual scene
          definitions may impose smaller budgets. Existing fixed-card and text
          limits are unchanged. Prior scene ownership entries use the same ceiling
          so a valid large scene remains eligible for cleanup when disabled.
          DOC
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Validate source, all static tests and regenerated Action
        run: npm run typecheck && npm run lint && npm run test:static && npm run build:action && node --test action/action.test.mjs
      - name: Save only the feature-branch repair and generated bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- packages/static/src/render.ts packages/static/src/generate.ts packages/static/tests/scenes.test.mjs docs/STATIC_GENERATOR_PLAN.md action/dist
          git rm -- .scene-policy.patch .scene-policy-tests.inc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'fix(static): honor scene delivery backend and byte budgets'
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/feat/static-scene-delivery
