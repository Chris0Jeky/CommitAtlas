# Temporary bounded branch repair; remove this workflow and edit manifest before merge.
name: Finish delivery benchmark safety
on:
  push:
    branches: [feat/public-delivery-evidence]
    paths: [.github/workflows/finish-delivery-benchmark.yml]
permissions:
  contents: write
concurrency:
  group: finish-delivery-benchmark-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/public-delivery-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply only hash-checked regression tests first
        run: |
          test "$(git rev-parse HEAD^)" = 05706e566efeb67b03afdaf453165dbfd3a9ae7d
          cat > /tmp/apply-benchmark.py <<'PY'
          import hashlib, json, pathlib, sys
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          manifest = json.loads(pathlib.Path('.github/benchmark-edits.json').read_text())
          assert len(manifest) == 12
          for item in manifest:
              name = item['path']
              is_test = name == 'packages/github/src/delivery.test.ts'
              if (sys.argv[1] == 'tests') != is_test:
                  continue
              path = pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              data = path.read_bytes()
              assert blob(data) == item['before'], f'Unexpected base at {name}'
              lines = data.decode().splitlines(keepends=True)
              for start, end, text in reversed(item['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = text.splitlines(keepends=True)
              result = ''.join(lines).encode()
              assert blob(result) == item['after'], f'Untested result at {name}'
              path.write_bytes(result)
              print(name, item['after'])
          PY
          python3 /tmp/apply-benchmark.py tests
      - run: npm ci
      - name: Prove the unsupported-default regression
        shell: bash
        run: |
          set +e
          npx --no-install tsx --test --test-name-pattern='delivery without an explicit benchmark' packages/github/src/delivery.test.ts > /tmp/benchmark-red.log 2>&1
          status=$?
          set -e
          cat /tmp/benchmark-red.log
          test "$status" = 1
          grep -q '^# fail 1$' /tmp/benchmark-red.log
      - name: Apply the remaining exact tested edits
        run: python3 /tmp/apply-benchmark.py implementation
      - name: Preserve runner source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/delivery-evidence
          cp /tmp/benchmark-red.log /tmp/delivery-evidence/
          git rev-parse HEAD > /tmp/delivery-evidence/head.txt
          git diff --binary > /tmp/delivery-evidence/applied.patch
          cp tsconfig.json /tmp/delivery-evidence/tsconfig.json
          node --version > /tmp/delivery-evidence/node.txt
          npm ls typescript --depth=0 > /tmp/delivery-evidence/typescript.txt
          git grep -n 'snapshot.benchmark' -- ':!action/dist/index.js' > /tmp/delivery-evidence/benchmark-callers.txt || test "$?" = 1
          rm -f tsconfig.tsbuildinfo
      - name: Rebuild the tracked Action and run the complete gate
        shell: bash
        run: |
          set -euo pipefail
          npm run build:action 2>&1 | tee /tmp/delivery-evidence/action-build.log
          npm run check 2>&1 | tee /tmp/delivery-evidence/full-check.log
          npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/delivery-evidence/audit.log
          git diff --check
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-verification-${{ github.sha }}
          path: /tmp/delivery-evidence
          retention-days: 7
      - name: Publish the verified candidate as a fast-forward only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATE.md docs/specs/PUBLIC_DELIVERY_EVIDENCE.md packages/github packages/static packages/svg action/dist/index.js
          git diff --cached --check
          git commit -m 'fix(delivery): withhold external comparison without a verified default'
          git push origin HEAD:refs/heads/feat/public-delivery-evidence
