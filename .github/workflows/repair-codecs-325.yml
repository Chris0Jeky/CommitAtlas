name: Temporary codec repair qualification
on:
  push:
    branches: [fix/image-archive-dependencies-325]
    paths: [.github/workflows/repair-codecs-325.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/fix/image-archive-dependencies-325'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Capture the actual failing regression before dependency changes
        run: |
          mkdir -p /tmp/codec-325
          cp package-lock.json /tmp/codec-325/before-lock.json
          set +e
          node --test tests/dependency-codecs.test.mjs > /tmp/codec-325/red.log 2>&1
          status=$?
          set -e
          test "$status" = 1
          grep -q '# fail 3' /tmp/codec-325/red.log
          grep -q '# pass 1' /tmp/codec-325/red.log
      - name: Resolve only the reviewed patched families
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          assert.equal(p.overrides, undefined);
          p.overrides={fflate:'0.7.5',sharp:'0.35.5'};
          p.scripts['test:dependency-codecs']='node --test tests/dependency-codecs.test.mjs';
          assert.equal(p.scripts.check.split('npm run test:packaging').length,2);
          p.scripts.check=p.scripts.check.replace('npm run test:packaging','npm run test:dependency-codecs && npm run test:packaging');
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const original=JSON.parse(fs.readFileSync('/tmp/codec-325/before-lock.json','utf8'));
          const candidate=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const family=key=>/(?:^|\/)node_modules\/(?:fflate|sharp)$/.test(key)||key.startsWith('node_modules/@img/sharp-');
          const changed=[];
          for(const key of new Set([...Object.keys(original.packages),...Object.keys(candidate.packages)])) {
            const a=original.packages[key],b=candidate.packages[key];
            if(family(key)) {
              if(JSON.stringify(a)!==JSON.stringify(b)) changed.push({path:key,before:a?.version??null,after:b?.version??null});
              if(b) original.packages[key]=b; else delete original.packages[key];
            } else {
              assert.ok(a&&b,`Unexpected package graph addition/removal: ${key}`);
              assert.equal(a.version,b.version,`Unreviewed package version: ${key}`);
              assert.deepEqual(a.dependencies,b.dependencies,`Unreviewed dependencies: ${key}`);
              assert.deepEqual(a.optionalDependencies,b.optionalDependencies,`Unreviewed optional graph: ${key}`);
            }
          }
          assert.equal(original.packages['node_modules/fflate'].version,'0.7.5');
          assert.equal(original.packages['node_modules/sharp'].version,'0.35.5');
          fs.writeFileSync('package-lock.json',JSON.stringify(original,null,2)+'\n');
          fs.writeFileSync('/tmp/codec-325/changes.json',JSON.stringify(changed,null,2)+'\n');
          JS
      - run: npm ci
      - name: Prove bounded ZIP rejection and native librsvg compatibility
        run: |
          set -euo pipefail
          node --test tests/dependency-codecs.test.mjs | tee /tmp/codec-325/green.log
          node -e "console.log(JSON.stringify(require('sharp').versions,null,2))" > /tmp/codec-325/native-versions.json
      - name: Retain fresh audit scopes and resolved dependency paths
        run: |
          node --input-type=module <<'JS'
          import {spawnSync,execFileSync} from 'node:child_process';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const destination='docs/evidence/codec-audit-2026-10-07';
          fs.mkdirSync(destination,{recursive:true});
          const exits={};
          for(const [name,args] of [['full',['audit','--json']],['production',['audit','--omit=dev','--json']],['paths',['ls','fflate','sharp','braces','micromatch','--all','--json']]]) {
            const r=spawnSync('npm',args,{encoding:'utf8',timeout:60000,maxBuffer:4*1024*1024});
            if(r.error||r.signal||![0,1].includes(r.status)) throw new Error(`${name} did not finish`);
            const value=JSON.parse(r.stdout);
            if(name==='full'&&(value.vulnerabilities?.fflate||value.vulnerabilities?.sharp)) throw new Error('Requested leaf advisories remain');
            if(name==='production'&&value.metadata.vulnerabilities.total!==0) throw new Error('Production audit regression');
            fs.writeFileSync(`${destination}/${name}.json`,r.stdout);
            exits[name]=r.status;
          }
          for(const name of ['changes.json','native-versions.json']) fs.copyFileSync('/tmp/codec-325/'+name,destination+'/'+name);
          const hash=p=>createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          fs.writeFileSync(`${destination}/receipt.json`,JSON.stringify({version:1,base:'fee65c41d2013edc1767b8ca950ff5e8f5fb4681',transportSource:execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),observedAt:new Date().toISOString(),node:process.version,lockSha256:hash('package-lock.json'),fullSha256:hash(`${destination}/full.json`),exits,regressions:{before:{failed:3,passed:1},after:{failed:0,passed:4}},fullAuditClean:false},null,2)+'\n');
          JS
      - run: npm run build:action
      - name: Remove temporary workflow and commit the candidate before reproducibility checks
        run: |
          set -euo pipefail
          git add -- package.json package-lock.json tests/dependency-codecs.test.mjs docs/evidence/codec-audit-2026-10-07 action/dist
          git rm -- .github/workflows/repair-codecs-325.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): pin patched fflate and sharp with bounded codec regressions'
      - run: npm run check > /tmp/codec-325/full-check.log 2>&1
      - name: Publish only the qualified fast-forward candidate
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/fix/image-archive-dependencies-325 | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/image-archive-dependencies-325
          git bundle create /tmp/codec-325/candidate.bundle HEAD
          git rev-parse HEAD > /tmp/codec-325/source.txt
          cp package.json package-lock.json /tmp/codec-325/
          cp -r docs/evidence/codec-audit-2026-10-07 /tmp/codec-325/audit
          printf 'Qualified source %s, full repository gate and four codec regressions passed.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: codec-325-qualification
          path: /tmp/codec-325/
          if-no-files-found: warn
          retention-days: 3
