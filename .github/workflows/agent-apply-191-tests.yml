name: Apply issue 191 regression tests

on:
  push:
    branches: [fix/191-browser-response-binding]
    paths:
      - .agent-patch
      - .github/workflows/agent-apply-191-tests.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Apply regression patch
        run: |
          git apply --check --recount .agent-patch
          git apply --recount .agent-patch

      - name: Commit test-first state
        run: |
          rm .agent-patch .github/workflows/agent-apply-191-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: pin browser-bound hosted response evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prove the regression is red
        run: npm run test:motion-probes
