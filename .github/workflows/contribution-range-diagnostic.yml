name: Contribution range candidate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/contribution-window-bounds-307'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply the reviewed, checksum-bound source patch
        shell: bash
        run: |
          base64 --decode .github/contribution-range.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/contribution-range.patch"
          echo "6c831cf7f2453a0cd7d487f0fca3293be807ff8f01421ad1d7f1e1626e95d76a  $RUNNER_TEMP/contribution-range.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/contribution-range.patch"
          git apply "$RUNNER_TEMP/contribution-range.patch"
          printf '%s\n' \
            'd29966ffbaa0ee675c3168e308fd53fab7d495abc1287754ce3ac7dd019b49e2  packages/github/src/client.ts' \
            '4559c1f145d5a01f95e208707357938f9d4b55bb1c730c12988823356ae8c8cd  lib/github/client.test.ts' \
            '93f4f2be99b5f426e5a71bd7a04dfcbe08b63be428ca174125baf4369af1fc29  docs/evidence/contribution-range-2026-10-06.json' \
            '08c06c9779032e58d1989bf42d1e0ff95712e235065e7f992713eafb6b70c80c  docs/superpowers/plans/2026-10-07-contribution-ranges.md' | sha256sum --check
      - run: npm ci
      - name: Rebuild and stage the tracked Action baseline
        run: |
          npm run build:action
          git add -- packages/github/src/client.ts lib/github/client.test.ts docs/evidence/contribution-range-2026-10-06.json docs/superpowers/plans/2026-10-07-contribution-ranges.md action/dist
      - name: Full candidate gate and production audit
        run: |
          npm run check
          npm audit --omit=dev --audit-level=high
          git diff --exit-code -- action/dist
      - name: Publish only the validated source and generated bundle to this PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, lstatSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const repo = 'Chris0Jeky/CommitAtlas';
          const branch = 'fix/contribution-window-bounds-307';
          const expected = process.env.EXPECTED_HEAD;
          assert.match(expected, /^[a-f0-9]{40}$/);
          assert.equal(process.env.GITHUB_REPOSITORY, repo);
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), expected);
          const sourceHashes = {
            'packages/github/src/client.ts': 'd29966ffbaa0ee675c3168e308fd53fab7d495abc1287754ce3ac7dd019b49e2',
            'lib/github/client.test.ts': '4559c1f145d5a01f95e208707357938f9d4b55bb1c730c12988823356ae8c8cd',
            'docs/evidence/contribution-range-2026-10-06.json': '93f4f2be99b5f426e5a71bd7a04dfcbe08b63be428ca174125baf4369af1fc29',
            'docs/superpowers/plans/2026-10-07-contribution-ranges.md': '08c06c9779032e58d1989bf42d1e0ff95712e235065e7f992713eafb6b70c80c',
          };
          const allowed = new Set([...Object.keys(sourceHashes), 'action/dist/index.js', 'action/dist/package.json']);
          const changed = execFileSync('git', ['diff', '--cached', '--name-only', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          assert.ok(changed.length >= 5);
          assert.ok(changed.every(path => allowed.has(path)), 'Unexpected staged path');
          for (const [path, hash] of Object.entries(sourceHashes)) {
            assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'), hash, path);
          }
          async function api(path, method = 'GET', body) {
            const response = await fetch(`https://api.github.com/repos/${repo}/${path}`, {
              method, headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' },
              body: body === undefined ? undefined : JSON.stringify(body), signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`GitHub ${method} ${path}: HTTP ${response.status}`);
            return response.json();
          }
          assert.equal((await api(`git/ref/heads/${branch}`)).object.sha, expected, 'Branch moved; refusing publication');
          const parent = await api(`git/commits/${expected}`);
          const tree = [];
          for (const path of changed) {
            assert.ok(lstatSync(path).isFile(), 'Only regular files may be published');
            const blob = await api('git/blobs', 'POST', { content: readFileSync(path).toString('base64'), encoding: 'base64' });
            tree.push({ path, type: 'blob', mode: '100644', sha: blob.sha });
          }
          const createdTree = await api('git/trees', 'POST', { base_tree: parent.tree.sha, tree });
          const commit = await api('git/commits', 'POST', { message: 'fix(github): bound contribution queries and validate joined calendars (#307)', tree: createdTree.sha, parents: [expected] });
          assert.equal((await api(`git/ref/heads/${branch}`)).object.sha, expected, 'Branch moved during publication');
          await api(`git/refs/heads/${branch}`, 'PATCH', { sha: commit.sha, force: false });
          console.log(JSON.stringify({ publishedHead: commit.sha, parent: expected, tree: createdTree.sha, paths: changed, qualification: 'Full candidate gate passed; remove temporary workflow and payload, then require fresh final-head CI before merge.' }, null, 2));
          NODE
