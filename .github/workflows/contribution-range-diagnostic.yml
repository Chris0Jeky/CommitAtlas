name: Contribution range diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/contribution-window-bounds-307'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Record public calendar range behavior
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const dayMs = 86400000;
          const to = new Date();
          const from = new Date(Date.UTC(to.getUTCFullYear(), to.getUTCMonth(), to.getUTCDate()) - 729 * dayMs);
          const middle = new Date(from.getTime() + 365 * dayMs);
          const ranges = [
            { kind: 'single-730-day', from, to },
            { kind: 'bounded-first', from, to: new Date(middle.getTime() - 1) },
            { kind: 'bounded-second', from: middle, to },
          ];
          const results = [];
          for (const range of ranges) {
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, 'content-type': 'application/json' },
              signal: AbortSignal.timeout(15000),
              body: JSON.stringify({
                query: 'query($login:String!,$from:DateTime!,$to:DateTime!){user(login:$login){contributionsCollection(from:$from,to:$to){contributionCalendar{weeks{contributionDays{date}}}}}}',
                variables: { login: 'Chris0Jeky', from: range.from.toISOString(), to: range.to.toISOString() },
              }),
            });
            const payload = await response.json();
            const dates = payload.data?.user?.contributionsCollection?.contributionCalendar?.weeks?.flatMap(w => w.contributionDays.map(d => d.date));
            const expected = [];
            for (let date = new Date(range.from); date <= range.to; date = new Date(date.getTime() + dayMs)) expected.push(date.toISOString().slice(0, 10));
            results.push({ kind: range.kind, from: range.from.toISOString(), to: range.to.toISOString(), status: response.status,
              error: payload.errors?.some(e => /exceed.*1 year|more than.*year|one year/i.test(e.message ?? '')) ? 'range-exceeds-one-year' : payload.errors?.length ? 'graphql-error' : null,
              returnedDays: dates?.length ?? null,
              complete: Array.isArray(dates) && dates.length === expected.length && expected.every((d, i) => d === dates[i]),
            });
          }
          const receipt = { version: 1, generatedAt: new Date().toISOString(), sourceHead: process.env.GITHUB_SHA, authentication: 'read-only repository GITHUB_TOKEN; API-range diagnostic, not classic-token client qualification', results };
          writeFileSync('contribution-range-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt, null, 2));
          NODE
      - name: Preserve locked local verification tools
        run: tar -czf contribution-verification-tools.tgz node_modules
      - uses: actions/upload-artifact@v6
        with:
          name: contribution-range-diagnostic-${{ github.event.pull_request.head.sha }}
          path: |
            contribution-range-receipt.json
            contribution-verification-tools.tgz
          retention-days: 3
