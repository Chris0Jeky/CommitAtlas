# Temporary read-only recovery transport; remove before merging #227.
name: Recover delivery verification
on:
  push:
    branches: [feat/public-delivery-evidence]
    paths: [.github/workflows/recover-delivery-verification.yml]
permissions:
  contents: read
jobs:
  recover:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/public-delivery-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Export public tracked source and locked test dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ca-verification
          git archive --format=tar.gz a4e1831d3ea023eb7cb7a673ff11e486cce10e9d > /tmp/ca-verification/delivery.tar.gz
          git archive --format=tar.gz 8fc6169282c3b05af4190010397abbf307ab1222 > /tmp/ca-verification/main.tar.gz
          git archive --format=tar.gz 37466699ede1e074d821c8f516c2c6840f7ea6a0 > /tmp/ca-verification/webkit.tar.gz
          node --input-type=module <<'JS'
          import { existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const names = ['zod','typescript','tsx','esbuild','@esbuild','get-tsconfig','resolve-pkg-maps','react','react-dom','scheduler','@types','@vercel/ncc'];
          execFileSync('tar', ['-czf','/tmp/ca-verification/dependencies.tar.gz', ...names.map(name => `node_modules/${name}`).filter(existsSync)]);
          JS
      - name: Retrieve the identified public primary report for chart inspection
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib
          root = pathlib.Path('/tmp/ca-verification')
          url = 'https://pages.jellyfish.co/rs/916-BAA-391/images/Jellyfish-AI-engineering-trends-report-Q126%20%281%29.pdf?version=0%2F'
          try:
              with urllib.request.urlopen(url, timeout=45) as response:
                  data = response.read(15_000_001)
              if len(data) > 15_000_000 or not data.startswith(b'%PDF-'):
                  raise ValueError('Report is oversized or not a PDF')
              (root / 'jellyfish-march-2026.pdf').write_bytes(data)
          except Exception as error:
              (root / 'report-download-status.txt').write_text(type(error).__name__ + ': report download failed; no evidence claim\n')
          PY
          cd /tmp/ca-verification
          sha256sum *.tar.gz *.pdf 2>/dev/null > SHA256SUMS || true
      - uses: actions/upload-artifact@v4
        with:
          name: ca-verification-${{ github.sha }}
          path: /tmp/ca-verification
          retention-days: 2
