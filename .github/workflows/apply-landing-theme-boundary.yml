name: Apply landing theme boundary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/landing-theme-boundary' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/landing-theme-boundary

      - name: Apply reviewed source and test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          landing = Path('lib/landing.ts')
          text = landing.read_text()
          anchor = 'import { buildStudioRouteUrl, type StudioCardKind, type StudioRouteOptions } from "@/app/studio/studio-urls";\n'
          replacement = anchor + 'import { themes, type ThemeName } from "@/packages/svg/src/index";\n'
          if anchor not in text:
              raise SystemExit('landing import anchor missing')
          text = text.replace(anchor, replacement, 1)
          old_function = '''export function landingThemedAtlasUrl(theme: string): string {
            return buildStudioRouteUrl("atlas", { ...LANDING_OPTIONS, theme });
          }
          '''
          new_function = '''export function landingThemedAtlasUrl(theme: ThemeName): string {
            if (!Object.hasOwn(themes, theme)) throw new Error("landing theme must be a shipped card theme");
            return buildStudioRouteUrl("atlas", { ...LANDING_OPTIONS, theme });
          }
          '''
          if old_function not in text:
              raise SystemExit('landing helper anchor missing')
          text = text.replace(old_function, new_function, 1)
          old_themes = 'export const CARD_THEMES: readonly { id: string; label: string; ground: string; light?: true }[] = ['
          new_themes = 'export const CARD_THEMES: readonly { id: ThemeName; label: string; ground: string; light?: true }[] = ['
          if old_themes not in text:
              raise SystemExit('CARD_THEMES anchor missing')
          landing.write_text(text.replace(old_themes, new_themes, 1))

          legacy_test = Path('lib/landing.test.ts')
          text = legacy_test.read_text()
          old_boundary = '''
            // Boundary: an empty theme is passed through as an empty param rather than falling back.
            const empty = parseUrl(landingThemedAtlasUrl(""));
            assert.equal(empty.searchParams.get("theme"), "");
            assert.equal(empty.searchParams.has("theme"), true);
          '''
          if old_boundary not in text:
              raise SystemExit('legacy empty-theme assertion missing')
          legacy_test.write_text(text.replace(old_boundary, '\n', 1))

          boundary_test = Path('lib/landing-theme-boundary.test.ts')
          text = boundary_test.read_text()
          old_call = '      () => landingThemedAtlasUrl(theme),\n'
          new_call = '      () => landingThemedAtlasUrl(theme as never),\n'
          if old_call not in text:
              raise SystemExit('boundary test call missing')
          boundary_test.write_text(text.replace(old_call, new_call, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-landing-theme-boundary.yml
          git add lib/landing.ts lib/landing.test.ts lib/landing-theme-boundary.test.ts
          git commit -m "fix: reject invalid landing theme ids"
          git push origin HEAD:fix/landing-theme-boundary
