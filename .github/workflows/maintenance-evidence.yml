# Temporary draft-branch verification; remove with delivery-visibility.patch before final review.
name: Delivery maintenance evidence
on:
  push:
    branches: [feat/public-delivery-evidence]
    paths: [.github/workflows/maintenance-evidence.yml]
permissions:
  contents: write
concurrency:
  group: delivery-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/public-delivery-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Prove the public-scope regressions on the original implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = cbe4b7e755a15d80ceafa09229483c4b38cb1ead
          git apply --include=packages/github/src/delivery-client.test.ts .github/delivery-visibility.patch
          set +e
          npx --no-install tsx --test packages/github/src/delivery-client.test.ts > /tmp/visibility-red.log 2>&1
          status=$?
          set -e
          cat /tmp/visibility-red.log
          test "$status" = 1
          grep -q '^# tests 6$' /tmp/visibility-red.log
          grep -q '^# fail 3$' /tmp/visibility-red.log
      - name: Apply the reviewed visibility guard and rebuild distribution
        run: |
          git apply --exclude=packages/github/src/delivery-client.test.ts .github/delivery-visibility.patch
          npm run build:action
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/github/src/delivery-client.ts packages/github/src/delivery-client.test.ts docs/specs/PUBLIC_DELIVERY_EVIDENCE.md action/dist/index.js
          git diff --cached --check
          git commit -m 'fix(delivery): prove every configured repository public in the aggregate request'
      - name: Verify the entire candidate
        run: npm run check && npm audit --omit=dev --audit-level=high
      - name: Publish only a verified fast-forward of the draft branch
        run: git push origin HEAD:refs/heads/feat/public-delivery-evidence
