# Temporary repair transport for PR #227. Remove before final review/merge.
name: Delivery maintenance evidence
on:
  push:
    branches: [feat/public-delivery-evidence]
    paths:
      - .github/workflows/maintenance-evidence.yml
      - packages/**
      - action/**
      - package.json
permissions:
  contents: write
concurrency:
  group: delivery-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/public-delivery-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Export public source and selected locked development dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/commitatlas-maintenance
          git archive --format=tar.gz 9c0aad155fc79989a72eadc36050ac1a74386598 > /tmp/commitatlas-maintenance/main.tar.gz
          git archive --format=tar.gz HEAD > /tmp/commitatlas-maintenance/delivery.tar.gz
          node --input-type=module <<'JS'
          import { existsSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const names = ['zod','typescript','tsx','esbuild','@esbuild','get-tsconfig','resolve-pkg-maps','react','react-dom','scheduler','@types','csstype','undici-types'];
          execFileSync('tar', ['-czf','/tmp/commitatlas-maintenance/dependencies.tar.gz', ...names.map(n => `node_modules/${n}`).filter(existsSync)]);
          JS
          git rev-parse HEAD > /tmp/commitatlas-maintenance/HEAD
          sha256sum /tmp/commitatlas-maintenance/*.tar.gz > /tmp/commitatlas-maintenance/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-${{ github.sha }}
          path: /tmp/commitatlas-maintenance/
          retention-days: 2
      - name: Rebuild only the checked Action distribution
        run: |
          npm run build:action
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add action/dist/index.js
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'build(action): refresh checked bundle for verified delivery repairs'; fi
      - name: Verify the entire candidate
        run: npm run check && npm audit --omit=dev --audit-level=high
      - name: Publish only a verified fast-forward of the draft branch
        run: git push origin HEAD:refs/heads/feat/public-delivery-evidence
