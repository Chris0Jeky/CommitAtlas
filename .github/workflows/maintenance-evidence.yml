# Temporary draft-branch transport. Remove with delivery-renderer.patch before final review.
name: Delivery maintenance evidence
on:
  push:
    branches: [feat/public-delivery-evidence]
    paths: [.github/workflows/maintenance-evidence.yml]
permissions:
  contents: write
concurrency:
  group: delivery-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/public-delivery-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply tested renderer consolidation and verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e460201a62f7928c58f7ee43f77ece32662adf96
          git apply --check .github/delivery-renderer.patch
          git apply .github/delivery-renderer.patch
          python3 - <<'PY'
          import subprocess
          expected = {
            'packages/static/src/delivery.ts':'635eb72993bf2ee95424e4dedabddd68b57d61a5',
            'packages/static/tests/delivery.test.mjs':'fc348e4ac70bdb065a714f0c72f99fd69c1531e3',
            'packages/static/tests/delivery-generation.test.mjs':'6c24df392fcc621c849af82e511955d4b16b02d3',
            'packages/svg/src/index.ts':'21cf631746063450630d0f801dc320f8ee772a29',
            'packages/svg/tests/delivery.test.mjs':'bb68d7cc9ddec9fb2bd32563071a1ea623405cc4',
            'packages/static/README.md':'5ab3e18616d86e133400da07cc097ede999bd0e6',
          }
          for file, sha in expected.items():
            if subprocess.check_output(['git','hash-object',file], text=True).strip() != sha:
              raise SystemExit(f'Published source differs from locally tested candidate: {file}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/static packages/svg
          git diff --cached --check
          git commit -m 'refactor(delivery): share one renderer and prove paired-artifact parity'
      - name: Preserve the newly merged lifecycle and Studio fixes
        shell: bash
        run: |
          set -euo pipefail
          git merge --no-commit --no-ff 8fc6169282c3b05af4190010397abbf307ab1222 || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import subprocess
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'], text=True).splitlines())
          if not conflicts <= {'action/dist/index.js'}: raise SystemExit(f'Unreviewed conflicts: {conflicts}')
          if conflicts:
            subprocess.run(['git','checkout','--ours','--','action/dist/index.js'],check=True)
            subprocess.run(['git','add','action/dist/index.js'],check=True)
          PY
          git commit -m 'merge: retain reviewed lifecycle and Studio fixes in delivery draft'
      - run: npm ci
      - name: Rebuild checked distribution
        run: |
          npm run build:action
          git add action/dist/index.js
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'build(action): include shared delivery rendering and public visibility validation'; fi
      - name: Verify the whole candidate
        run: npm run check && npm audit --omit=dev --audit-level=high
      - name: Publish only a verified fast-forward of the draft branch
        run: git push origin HEAD:refs/heads/feat/public-delivery-evidence
