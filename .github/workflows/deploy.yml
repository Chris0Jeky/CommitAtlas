name: Deploy

# Deploys the exact commit that already passed the quality gate. A push never
# deploys on its own: CI must conclude successfully on `main` first, and this
# workflow then checks out that same head SHA rather than whatever `main`
# points at by the time it runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  cloudflare:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Resolve deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Cloudflare deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable hosted deployment. See docs/DEPLOYMENT.md.'
          fi

      - name: Check out the proven commit
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: npm ci

      - name: Build the Worker and its assets
        if: steps.credentials.outputs.configured == 'true'
        run: npm run build

      - name: Deploy to Cloudflare Workers
        if: steps.credentials.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify the deployed surface
        if: steps.credentials.outputs.configured == 'true'
        env:
          BASE_URL: ${{ vars.DEPLOY_BASE_URL || 'https://commit-atlas.commit-atlas.workers.dev' }}
        run: node scripts/verify-deployment.mjs "$BASE_URL"
