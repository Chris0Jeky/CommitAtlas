name: Qualify current-head CI evidence
on:
  push:
    branches: [fix/ci-current-head-348-20261012]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Pin input and install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-head-proof"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 998f118b14e6d0605bd38641490500523d2a4673
          {
            printf 'SOURCE_HEAD=%s\nSOURCE_TREE=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})"
            node --version
            npm --version
            sha256sum package-lock.json .github/scripts/qualify-ci-head.py packages/github/tests/ci-current-head.test.mjs
          } | tee "$RUNNER_TEMP/ci-head-proof/source.txt"
          npm ci 2>&1 | tee "$RUNNER_TEMP/ci-head-proof/install.log"
      - name: Reproduce old-head attribution before applying the repair
        shell: bash
        run: |
          set -euo pipefail
          npm run build:github > "$RUNNER_TEMP/ci-head-proof/red-build.log" 2>&1
          set +e
          node --test --test-concurrency=2 packages/github/tests/ci-current-head.test.mjs > "$RUNNER_TEMP/ci-head-proof/red.log" 2>&1
          status=$?
          set -e
          test "$status" = 1
          grep -E '^# fail 34$' "$RUNNER_TEMP/ci-head-proof/red.log"
          grep -E '^# pass 6$' "$RUNNER_TEMP/ci-head-proof/red.log"
          grep -E 'not ok .*success run on an older revision' "$RUNNER_TEMP/ci-head-proof/red.log"
      - name: Apply the reviewed source and verify its exact output identities
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/qualify-ci-head.py | tee "$RUNNER_TEMP/ci-head-proof/prepared.txt"
          test "$(git hash-object packages/github/src/client.ts)" = 4297f825d87f2d0abab254d9fc4eeae690878f7c
          test "$(git hash-object lib/github/client.test.ts)" = 55840d00c57b443f6e13e79ca6050513869b2c61
          test "$(git hash-object lib/github/terminal-conclusions.test.ts)" = f02fc487fe3d0a4633e40797830bdd5b869f98f4
          test "$(git hash-object tests/rendered-html.test.mjs)" = 8a3fb83a1f74d46f3deab5043bc0a15e4ca478a
          test "$(git hash-object package.json)" = 39a8b6d642b17c1c033223942c195a69b6d0a70
          npm run build:github > "$RUNNER_TEMP/ci-head-proof/green-build.log" 2>&1
          node --test --test-concurrency=2 packages/github/tests/ci-current-head.test.mjs 2>&1 | tee "$RUNNER_TEMP/ci-head-proof/green.log"
      - name: Rebuild the Action and run complete locked validation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/ci-head-proof/check.log") 2>&1
          npm run build:action
          git diff -- packages/github/src/client.ts lib/github/client.test.ts lib/github/terminal-conclusions.test.ts tests/rendered-html.test.mjs package.json action/dist > "$RUNNER_TEMP/ci-head-proof/generated.patch"
          git config user.name 'CommitAtlas qualification'
          git config user.email 'qualification@users.noreply.github.com'
          git add packages/github/src/client.ts lib/github/client.test.ts lib/github/terminal-conclusions.test.ts tests/rendered-html.test.mjs package.json action/dist
          git commit -m 'Local-only exact current-head evidence candidate'
          npm run check
          npm audit --omit=dev --audit-level=high
          test -z "$(git status --porcelain)"
      - name: Preserve qualified blobs only, never move a ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$GITHUB_SHA" HEAD | while IFS= read -r file; do
            case "$file" in packages/github/src/client.ts|lib/github/client.test.ts|lib/github/terminal-conclusions.test.ts|tests/rendered-html.test.mjs|package.json|action/dist/*) ;; *) exit 1 ;; esac
            test -f "$file"
            mkdir -p "$RUNNER_TEMP/ci-head-proof/generated/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/ci-head-proof/generated/$file"
            python3 - "$file" "$RUNNER_TEMP/blob.json" <<'PY'
          import base64, json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'encoding': 'base64', 'content': base64.b64encode(path.read_bytes()).decode()}))
          PY
            sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq '.sha')
            test "$sha" = "$(git hash-object "$file")"
            printf 'VERIFIED_BLOB %s %s\n' "$file" "$sha" | tee -a "$RUNNER_TEMP/ci-head-proof/bundle.txt"
          done
          printf 'QUALIFIED_SOURCE_HEAD=%s\n' "$GITHUB_SHA" | tee -a "$RUNNER_TEMP/ci-head-proof/bundle.txt"
      - name: Retain qualification evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-head-348-${{ github.sha }}
          path: ${{ runner.temp }}/ci-head-proof
          retention-days: 14
          if-no-files-found: error
