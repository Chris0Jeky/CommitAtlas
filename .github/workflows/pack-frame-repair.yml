name: Temporary pack frame qualification
on:
  push:
    branches: [fix/pack-frame-boundaries-20261008]
    paths: [.github/workflows/pack-frame-repair.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/fix/pack-frame-boundaries-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply the exact locally tested patch without other source changes
        run: |
          mkdir -p /tmp/pack-qualification
          cp .pack-frame-repair.patch /tmp/pack-qualification/patch.txt
          python3 <<'PY'
          import hashlib,pathlib,subprocess
          patch=pathlib.Path('.pack-frame-repair.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='fce5708273229669eecae99c090bf738801e5ab8db5c2920bab77964f06f38c4'
          subprocess.run(['git','apply','--index','--whitespace=error'],input=patch,check=True)
          expected=['docs/SCENE_PACK_FRAME_BOUNDARIES.md','packages/svg/src/packs.ts','packages/svg/src/primitives/index.ts','packages/svg/tests/packs.test.mjs']
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert actual==expected,actual
          PY
          git rm -- .pack-frame-repair.patch .github/workflows/pack-frame-repair.yml
      - run: npm ci
      - run: npm run build:action
      - name: Commit source and generated Action before the reproducibility gate
        run: |
          git add -- action/dist
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(svg): protect pack frame readings from decorative geometry'
      - run: npm run check > /tmp/pack-qualification/check.log 2>&1
      - name: Publish qualified source without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/fix/pack-frame-boundaries-20261008 | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/pack-frame-boundaries-20261008
          git rev-parse HEAD > /tmp/pack-qualification/source.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pack-frame-qualification
          path: /tmp/pack-qualification/
          if-no-files-found: warn
          retention-days: 3
