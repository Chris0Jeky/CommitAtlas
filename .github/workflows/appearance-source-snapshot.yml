name: Appearance source snapshot
on:
  push:
    branches: [design/appearance-polish-20261026]
    paths: [.github/workflows/appearance-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 05fb0497a2cd5145f49c9b7e86faf2993dfd01cc
          persist-credentials: false
      - name: Export authoritative source and Git identity
        run: |
          mkdir -p "$RUNNER_TEMP/commitatlas-source"
          git archive --format=tar.gz --output="$RUNNER_TEMP/commitatlas-source/source.tar.gz" HEAD
          git cat-file commit HEAD > "$RUNNER_TEMP/commitatlas-source/source.commit"
          git rev-parse HEAD > "$RUNNER_TEMP/commitatlas-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/commitatlas-source/tree.txt"
          cd "$RUNNER_TEMP/commitatlas-source"
          sha256sum source.tar.gz source.commit > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: commitatlas-source-05fb0497a2cd5145f49c9b7e86faf2993dfd01cc
          path: ${{ runner.temp }}/commitatlas-source
          if-no-files-found: error
          retention-days: 7
