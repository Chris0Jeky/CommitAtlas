name: Temporary offline workspace export
on:
  push:
    branches: [diagnostic/workspace-20261007]
    paths: [.github/workflows/export-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/diagnostic/workspace-20261007'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4b8acb2e83aad82d56e3c05050bf48f8f5dd67f6
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Archive only tracked public source and installed public packages
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4b8acb2e83aad82d56e3c05050bf48f8f5dd67f6
          mkdir -p /tmp/commitatlas-offline
          git archive --format=tar HEAD -o /tmp/commitatlas-offline/workspace.tar
          tar --append --file=/tmp/commitatlas-offline/workspace.tar node_modules
          gzip /tmp/commitatlas-offline/workspace.tar
          { git rev-parse HEAD; node --version; npm --version; sha256sum package-lock.json /tmp/commitatlas-offline/workspace.tar.gz; } > /tmp/commitatlas-offline/provenance.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commitatlas-offline-4b8acb2
          path: /tmp/commitatlas-offline/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
