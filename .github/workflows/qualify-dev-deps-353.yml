name: Qualify dependency generated outputs
on:
  push:
    branches: [dependabot/npm_and_yarn/development-dependencies-e976f226ba]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Pin the dependency candidate and install its lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deps-proof/generated"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 312306d621d252a507553a3c4d2f0ffe5f1175a5
          {
            printf 'SOURCE_HEAD=%s\nSOURCE_TREE=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})"
            node --version
            npm --version
            sha256sum package.json package-lock.json worker-configuration.d.ts
          } | tee "$RUNNER_TEMP/deps-proof/source.txt"
          npm ci 2>&1 | tee "$RUNNER_TEMP/deps-proof/install.log"
      - name: Reproduce the generated Worker type mismatch
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm run typecheck:worker > "$RUNNER_TEMP/deps-proof/red.log" 2>&1
          status=$?
          set -e
          test "$status" = 1
          grep 'Types at worker-configuration.d.ts are out of date' "$RUNNER_TEMP/deps-proof/red.log"
      - name: Regenerate with the installed compiler and verify all gates
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/deps-proof/check.log") 2>&1
          ./node_modules/.bin/wrangler types worker-configuration.d.ts --env-interface CloudflareBindings --include-runtime=false
          npm run typecheck:worker
          npm run build:action
          git diff -- worker-configuration.d.ts action/dist > "$RUNNER_TEMP/deps-proof/generated.patch"
          git config user.name 'CommitAtlas qualification'
          git config user.email 'qualification@users.noreply.github.com'
          git add worker-configuration.d.ts action/dist
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in worker-configuration.d.ts|action/dist/*) ;; *) exit 1 ;; esac
          done
          git commit -m 'Local-only regenerated dependency outputs'
          npm run check
          npm audit --omit=dev --audit-level=high
          test -z "$(git status --porcelain)"
      - name: Retain separate full-toolchain audit evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          npm audit --json > "$RUNNER_TEMP/deps-proof/full-audit.json"
          status=$?
          set -e
          test "$status" -le 1
          node -e 'const a=require(process.argv[1]); if(a.error || !a.metadata?.vulnerabilities) process.exit(1); console.log(JSON.stringify(a.metadata.vulnerabilities))' "$RUNNER_TEMP/deps-proof/full-audit.json"
      - name: Preserve verified generated blobs without moving a ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$GITHUB_SHA" HEAD -- worker-configuration.d.ts action/dist | while IFS= read -r file; do
            test -f "$file"
            mkdir -p "$RUNNER_TEMP/deps-proof/generated/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/deps-proof/generated/$file"
            python3 - "$file" "$RUNNER_TEMP/deps-blob.json" <<'PY'
          import base64, json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'encoding': 'base64', 'content': base64.b64encode(path.read_bytes()).decode()}))
          PY
            sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/deps-blob.json" --jq '.sha')
            test "$sha" = "$(git hash-object "$file")"
            printf 'VERIFIED_BLOB %s %s\n' "$file" "$sha" | tee -a "$RUNNER_TEMP/deps-proof/bundle.txt"
          done
          printf 'QUALIFIED_SOURCE_HEAD=%s\n' "$GITHUB_SHA" | tee -a "$RUNNER_TEMP/deps-proof/bundle.txt"
      - name: Retain bounded qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: deps-353-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/deps-proof
          retention-days: 14
          if-no-files-found: error
