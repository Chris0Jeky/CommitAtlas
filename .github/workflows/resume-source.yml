name: Temporary resume source export
on:
  push:
    branches: [diagnostic/resume-20261008]
    paths: [.github/workflows/resume-source.yml]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/diagnostic/resume-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 826c5f0912e2cfff77dae12a7a9365040c59982c
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked public source and unfinished codec branch history
        run: |
          set -euo pipefail
          mkdir -p /tmp/commitatlas-resume
          test "$(git rev-parse HEAD)" = 826c5f0912e2cfff77dae12a7a9365040c59982c
          git bundle create /tmp/commitatlas-resume/source.bundle HEAD refs/remotes/origin/fix/image-archive-dependencies-325
          git bundle verify /tmp/commitatlas-resume/source.bundle
          git bundle list-heads /tmp/commitatlas-resume/source.bundle > /tmp/commitatlas-resume/refs.txt
          sha256sum /tmp/commitatlas-resume/source.bundle > /tmp/commitatlas-resume/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: commitatlas-resume-source
          path: /tmp/commitatlas-resume/
          if-no-files-found: error
          retention-days: 3
