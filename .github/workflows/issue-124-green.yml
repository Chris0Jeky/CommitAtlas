name: Issue 124 implementation bootstrap

on:
  push:
    branches:
      - codex/issue-124-motion-profiles

permissions:
  contents: write

concurrency:
  group: issue-124-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reconcile bootstrap with current formatting
        run: python3 .github/agent/issue-124-fixup.py

      - name: Implement the motion profile contract
        run: python3 .github/agent/issue-124-green.py

      - name: Remove one-shot bootstrap machinery
        shell: bash
        run: |
          rm .github/workflows/issue-124-green.yml
          rm .github/agent/issue-124-green.py
          rm .github/agent/issue-124-fixup.py
          rmdir .github/agent 2>/dev/null || true

      - name: Check patch hygiene
        run: git diff --check

      - name: Check Worker bindings
        run: npm run typecheck:worker

      - name: Typecheck application
        run: npm run typecheck

      - name: Lint repository
        run: npm run lint

      - name: Test observatory
        run: npm run test:observatory

      - name: Test deployment tooling
        run: npm run test:deploy-tooling

      - name: Test motion probes
        run: npm run test:motion-probes

      - name: Test core package
        run: npm run test:core

      - name: Test chassis
        run: npm run test:chassis

      - name: Test GitHub and hosted routes
        run: npm run test:github

      - name: Test Studio
        run: npm run test:studio

      - name: Test SVG package
        run: npm run test:svg

      - name: Test static generator
        run: npm run test:static

      - name: Test bundled Action
        run: npm run test:action

      - name: Test package artifacts
        run: npm run test:packaging

      - name: Build and test rendered application
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: expand the motion profile contract"
          git push origin HEAD:codex/issue-124-motion-profiles
