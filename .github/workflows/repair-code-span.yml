# Temporary branch repair; remove before final review.
name: Verify Markdown code span repair
on:
  push:
    branches: [fix/markdown-code-span-lines]
    paths: [.github/workflows/repair-code-span.yml]
permissions:
  contents: write
concurrency:
  group: repair-code-span-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/fix/markdown-code-span-lines'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Retain the final reviewed delivery producer and all its tests
        run: |
          test "$(git rev-parse HEAD^)" = 89402ac6eb665f0cc5e4e4332a70ce0dd8b2991e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit --no-ff 822f475bbe4aeee3db50c89cf23762e0c6928c8f
      - run: npm ci
      - name: Prove RED before altering the helper
        shell: bash
        run: |
          set -euo pipefail
          npm run build:static
          set +e
          node --test packages/static/tests/code-span.test.mjs > /tmp/code-span-red.log 2>&1
          status=$?
          set -e
          cat /tmp/code-span-red.log
          test "$status" = 1
          grep -q '^# tests 2$' /tmp/code-span-red.log
          grep -q '^# fail 2$' /tmp/code-span-red.log
      - name: Apply four exact hash-checked changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          def sha(p):
              return subprocess.check_output(['git','hash-object',str(p)], text=True).strip()
          def edit(name, before, after, old, new):
              p = Path(name)
              assert sha(p) == before, 'Unexpected base: ' + name
              text = p.read_text()
              assert text.count(old) == 1
              p.write_text(text.replace(old, new))
              assert sha(p) == after, 'Untested result: ' + name
          old = '  if (value.length === 0) throw new Error("Cannot render an empty value as a Markdown code span");\n'
          edit('packages/static/src/projects-catalog.ts',
            '1a954c0e96a27987bfbe9d377f9203304ba21857', 'a567ef353c8ea875f7377c762107f1d6e3310f66', old,
            old + '  // CommonMark normalizes line endings before deciding whether boundary padding is stripped.\n  value = value.replace(/\\r\\n|[\\r\\n]/g, " ");\n')
          edit('packages/static/package.json',
            'b02a63ddb53bfc5f95f15a5fc0409a3e616dca0f', '52d5caf3c4d163933e6e5f2baa33f7a734f947c3',
            'tests/entrypoint.test.mjs tests/delivery.test.mjs',
            'tests/entrypoint.test.mjs tests/code-span.test.mjs tests/delivery.test.mjs')
          edit('tests/projects-catalog.test.ts',
            'e899866329e38de3c958bee20c7c6b7a3c4f4579', 'bc30600e53295bc4d24d5309a2d4556a165d1349',
            'test("codeSpan keeps a pipe or newline inside a single-backtick span", () => {\n  assert.equal(codeSpan("a|b"), "`a|b`");\n  assert.equal(codeSpan("a\\nb"), "`a\\nb`");\n});',
            'test("codeSpan preserves pipes and normalizes line endings inside a single-backtick span", () => {\n  assert.equal(codeSpan("a|b"), "`a|b`");\n  for (const ending of ["\\n", "\\r\\n", "\\r"]) {\n    assert.equal(codeSpan(`a${ending}b`), "`a b`");\n  }\n});')
          assert sha(Path('packages/static/tests/code-span.test.mjs')) == '2af7cfcf9d7a9667b4a9c32bc6f537d06631ed52'
          PY
      - name: Rebuild and seal the candidate before the Action drift check
        run: |
          npm run build:action
          git add packages/static/src/projects-catalog.ts packages/static/package.json tests/projects-catalog.test.ts action/dist/index.js
          git diff --cached --check
          git commit -m 'fix(static): normalize Markdown line endings before code-span padding'
      - name: Verify the complete candidate
        run: |
          npm run check
          npm audit --omit=dev --audit-level=high
          git diff --check
          git diff --exit-code
      - name: Publish only the verified branch candidate
        run: git push origin HEAD:refs/heads/fix/markdown-code-span-lines
