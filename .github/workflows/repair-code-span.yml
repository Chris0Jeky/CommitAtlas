# Temporary final reconciliation; remove before merge.
name: Verify Markdown code span repair
on:
  push:
    branches: [fix/markdown-code-span-lines]
    paths: [.github/workflows/repair-code-span.yml]
permissions:
  contents: write
concurrency:
  group: repair-code-span-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/fix/markdown-code-span-lines'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Preserve both independently tested fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5557ac89fa530c778ebc29c8c570867e7711a98b
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 645a69eb1b3c163e929611dd5c8430ffd8fb49e3 || test -f .git/MERGE_HEAD
          python3 - <<'PY'
          import subprocess
          conflicts = set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert conflicts <= {'action/dist/index.js'}, f'Unreviewed conflicts: {conflicts}'
          if conflicts:
              subprocess.run(['git','checkout','--ours','--','action/dist/index.js'],check=True)
              subprocess.run(['git','add','action/dist/index.js'],check=True)
          for path, expected in {
              'packages/github/src/delivery.ts': 'fe221336685dc757f0babe6f658cac69d71ca008',
              'packages/github/src/delivery.test.ts': 'e0cf763fc73799cccf4051e99fef9be9ff873aca',
              'packages/static/src/projects-catalog.ts': 'a567ef353c8ea875f7377c762107f1d6e3310f66',
              'packages/static/package.json': '52d5caf3c4d163933e6e5f2baa33f7a734f947c3',
              'tests/projects-catalog.test.ts': 'bc30600e53295bc4d24d5309a2d4556a165d1349',
              'packages/static/tests/code-span.test.mjs': '2af7cfcf9d7a9667b4a9c32bc6f537d06631ed52'
          }.items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip() == expected, path
          PY
      - run: npm ci
      - name: Rebuild the combined Action and seal the merge candidate
        run: |
          npm run build:action
          git add action/dist/index.js
          git diff --cached --check
          git commit -m 'merge: preserve reviewed delivery provenance alongside Markdown normalization'
      - name: Verify the full combined candidate
        run: |
          npm run check
          npm audit --omit=dev --audit-level=high
          git diff --exit-code
      - name: Publish verified branch only
        run: git push origin HEAD:refs/heads/fix/markdown-code-span-lines
