name: Temporary evidence source recovery
on:
  push:
    branches: [feat/evidence-coverage-scene]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/feat/evidence-coverage-scene'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive tracked public source only
        run: |
          mkdir /tmp/evidence-source
          git rev-parse HEAD > /tmp/evidence-source/source-sha.txt
          git ls-tree -r HEAD > /tmp/evidence-source/source-tree.txt
          git archive --format=tar.gz HEAD > /tmp/evidence-source/source.tar.gz
          cd /tmp/evidence-source
          sha256sum source.tar.gz > sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-source-recovery
          path: /tmp/evidence-source/*
          retention-days: 3
          if-no-files-found: error
