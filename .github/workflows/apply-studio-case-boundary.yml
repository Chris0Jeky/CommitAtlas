name: Apply Studio case boundary

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/studio-case-canonicalization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/studio-case-canonicalization

      - name: Update legacy key assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          existing = Path('app/studio/studio-urls.test.ts')
          text = existing.read_text()
          old_baseline = '  const baseline = { owner: " Octocat ", theme: "ember", demo: true, projects };'
          new_baseline = '  const baseline = { owner: " octocat ", theme: "ember", demo: true, projects };'
          if old_baseline not in text:
              raise SystemExit('baseline key test anchor missing')
          text = text.replace(old_baseline, new_baseline, 1)

          stable_anchor = '  assert.notEqual(key, buildStudioConfigurationKey({ ...baseline, owner: "other" }));'
          inserted = '  assert.notEqual(key, buildStudioConfigurationKey({ ...baseline, owner: "Octocat" }));\n' + stable_anchor
          if stable_anchor not in text:
              raise SystemExit('stable key assertion anchor missing')
          existing.write_text(text.replace(stable_anchor, inserted, 1))
          PY

      - name: Verify focused Studio suite
        run: |
          npm ci
          npm run test:studio

      - name: Commit test and remove applicator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-studio-case-boundary.yml
          git add app/studio/studio-urls.test.ts
          git commit -m "test(studio): pin case-sensitive preview identity"
          git push origin HEAD:fix/studio-case-canonicalization
