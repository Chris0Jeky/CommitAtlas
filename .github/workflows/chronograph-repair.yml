name: Temporary chronograph repair qualification
on:
  push:
    branches: [fix/chronograph-evidence-20261008]
    paths: [.github/workflows/chronograph-repair.yml]
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'Chris0Jeky/CommitAtlas' && github.ref == 'refs/heads/fix/chronograph-evidence-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.13.0
          cache: npm
      - name: Verify and apply only the reviewed source patch
        run: |
          mkdir -p /tmp/chrono-qualification
          cp .chronograph-repair.b64 /tmp/chrono-qualification/transport.txt
          python3 <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=pathlib.Path('.chronograph-repair.b64').read_text()
          # Downloaded failed transport was compared with the locally tested patch.
          # The original exact compressed digest remains the acceptance gate.
          for old,new in [
            ('2c2205ntl7MYUCB4c','2c2205nt7MYUCB4c'),
            ('IriopEt6IUW6TCEllB','IriopEt6gW6TCEllB'),
            ('bcYXdRaVIEd2BmHmF','bcYXdRaVEd2BmHmF'),
            ('Ch7bZY1cCalFHQaD','Ch7bZY1cVCalFHQaD'),
            ('7JjfuncYcKWgAVdEw','7JjfuncYKWgAVdEw'),
            ('nyi67ijYF14qGfWl','nyi67ijYjF14qGfWl'),
            ('GOTb6K6zDTRM18M1kx','GOTb6K6zXRM18M1kx')
          ]:
            assert encoded.count(old)==1
            encoded=encoded.replace(old,new,1)
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='5acc0a862dafc736d01abdd141d08d5ce863df29eed51b376cedf88f00ee3921'
          patch=gzip.decompress(packed)
          subprocess.run(['git','apply','--index','--whitespace=error'],input=patch,check=True)
          expected=['docs/CHRONOGRAPH_EVIDENCE.md','packages/svg/src/scenes/chronograph.ts','packages/svg/tests/chronograph.test.mjs']
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert actual==expected,actual
          PY
          git rm -- .chronograph-repair.b64 .github/workflows/chronograph-repair.yml
      - run: npm ci
      - run: npm run build:action
      - name: Commit source and generated Action before reproducibility checks
        run: |
          git add -- action/dist
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(svg): validate chronograph provenance and release observations'
      - run: npm run check > /tmp/chrono-qualification/check.log 2>&1
      - name: Publish verified source without overwriting concurrent work
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/fix/chronograph-evidence-20261008 | cut -f1)" = "$EXPECTED_HEAD"
          git push origin HEAD:refs/heads/fix/chronograph-evidence-20261008
          git rev-parse HEAD > /tmp/chrono-qualification/source.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chronograph-qualification
          path: /tmp/chrono-qualification/
          if-no-files-found: warn
          retention-days: 3
