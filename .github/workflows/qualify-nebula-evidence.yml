name: Qualify nebula evidence repair
on:
  push:
    branches: [fix/nebula-release-evidence-347-20261012]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Pin the input and preserve its identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nebula-proof"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            printf 'SOURCE_HEAD=%s\nSOURCE_TREE=%s\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})"
            sha256sum package-lock.json packages/svg/src/scenes/nebula.ts packages/svg/tests/scenes/nebula.test.mjs packages/svg/tests/nebula-clock.test.mjs packages/svg/package.json
          } | tee "$RUNNER_TEMP/nebula-proof/source.txt"
          sha256sum --check <<'HASHES'
          11e0f861c8dc5047f41040c71eb155a9b04266735baa63b6b42d575607a612e4  package-lock.json
          4e5336d3d3d470c13bf255f519da03f82e972c8147e69ab9b971bdd15e5af837  packages/svg/src/scenes/nebula.ts
          849477c6b3d7c029756e3d5578c55788d935af64371bbb0f616f7330bacc6bb8  packages/svg/tests/scenes/nebula.test.mjs
          faad9bb1c80929de0026e4a74d995074f20d4450b739ac12a4a5a75a672dc599  packages/svg/tests/nebula-clock.test.mjs
          a60d0c48e591821c0d7a52a2b7b51cc92b02c48be0cc03fdde150a9a08c7d21d  packages/svg/package.json
          HASHES
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install exact locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee "$RUNNER_TEMP/nebula-proof/versions.txt"
          npm --version | tee -a "$RUNNER_TEMP/nebula-proof/versions.txt"
          npm ci 2>&1 | tee "$RUNNER_TEMP/nebula-proof/install.log"
      - name: Rebuild bundle and run the complete gate
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/nebula-proof/check.log") 2>&1
          npm run build:action
          git config user.name 'CommitAtlas qualification'
          git config user.email 'qualification@users.noreply.github.com'
          git add action/dist
          if ! git diff --cached --quiet; then git commit -m 'Local-only verified Action bundle'; fi
          npm run check
          npm audit --omit=dev --audit-level=high
          test -z "$(git status --porcelain)"
      - name: Preserve verified bundle blobs without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$GITHUB_SHA" HEAD -- action/dist | while IFS= read -r file; do
            test -f "$file"
            python3 - "$file" "$RUNNER_TEMP/nebula-blob.json" <<'PY'
          import base64, json, pathlib, sys
          p = pathlib.Path(sys.argv[1])
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'encoding':'base64','content':base64.b64encode(p.read_bytes()).decode()}))
          PY
            sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/nebula-blob.json" --jq '.sha')
            test "$sha" = "$(git hash-object "$file")"
            printf 'VERIFIED_BLOB %s %s\n' "$file" "$sha" | tee -a "$RUNNER_TEMP/nebula-proof/bundle.txt"
          done
          printf 'QUALIFIED_SOURCE_HEAD=%s\n' "$GITHUB_SHA" | tee -a "$RUNNER_TEMP/nebula-proof/bundle.txt"
      - name: Retain evidence even for a failed attempt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nebula-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/nebula-proof
          retention-days: 14
          if-no-files-found: error
